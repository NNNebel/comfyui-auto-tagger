<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Inspector</title>
    <style>
        :root {
            --accent: #007aff;
            --success: #34c759;
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        }

        /* LIGHT テーマ */
        body[theme="LIGHT"], body[theme="LIGHTGRAY"] {
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --card-hover: #fcfcfc;
            --border: rgba(0, 0, 0, 0.08);
            --divider: rgba(0, 0, 0, 0.04);
            --text: #1a1a1a;
            --text-muted: #8e8e93;
            --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* DARK 系テーマ */
        body[theme="GRAY"], body[theme="BLUE"], body[theme="PURPLE"], body[theme="DARK"] {
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.1);
            --divider: rgba(255, 255, 255, 0.05);
            --text: #efefef;
            --text-muted: rgba(255, 255, 255, 0.35);
            --card-shadow: none;
        }
        body[theme="DARK"] { --bg: #1e1e1e; }
        body[theme="GRAY"] { --bg: #262626; }
        body[theme="BLUE"] { --bg: #1a202c; }
        body[theme="PURPLE"] { --bg: #231932; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            padding: 10px 0; /* 左右パディング0 */
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease;
            overflow-y: auto;
        }

        body[theme="LIGHT"], body[theme="LIGHTGRAY"] { background-color: var(--bg) !important; }
        body[theme="GRAY"] { background-color: #262626 !important; }
        body[theme="DARK"] { background-color: #1e1e1e !important; }
        body[theme="BLUE"] { background-color: #1a202c !important; }
        body[theme="PURPLE"] { background-color: #231932 !important; }

        /* ── Section Header ── */
        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin: 14px 0 5px 12px; /* 左端から12pxに合わせる */
            letter-spacing: 0.02em;
        }
        .section-title:first-child { margin-top: 0; }

        /* ── Unified Card ── */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            margin: 0 4px; /* サイドバーの境界まで攻める (4px) */
        }

        /* ── List Item (Row) ── */
        .row {
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 8px 10px; /* 内部パディング8px、カードマージン4pxと合わせて12px */
            cursor: pointer;
            transition: background-color 0.15s ease;
            border-bottom: 1px solid var(--divider);
        }
        .row:last-child { border-bottom: none; }
        .row:hover {
            background: var(--card-hover);
        }

        .row-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 1px;
            opacity: 0.8;
        }

        .row-value {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .row-value.mono {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: -0.01em;
        }

        /* ── Parameters Grid (NO vertical borders) ── */
        .grid-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            border-bottom: 1px solid var(--divider);
        }
        .grid-row .row { border-bottom: none; border-right: none; } /* 縦線を削除 */

        /* ── Copy Feedback ── */
        .copy-icon {
            position: absolute;
            right: 10px;
            top: 10px;
            width: 12px;
            height: 12px;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .row:hover .copy-icon { opacity: 0.5; }

        .copied-label {
            position: absolute;
            right: 10px;
            top: 10px;
            font-size: 9px;
            font-weight: 700;
            color: var(--success);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .row.is-copied .copied-label { opacity: 1; transform: translateX(-4px); }
        .row.is-copied .row-value { color: var(--success); opacity: 0.8; }
        .row.is-copied .copy-icon { display: none; }

        /* ── Tabs (Segmented Control) ── */
        .tab-bar {
            display: flex;
            background: var(--card-bg);
            padding: 2px;
            border-radius: 6px;
            margin: 0 4px 10px 4px; /* カードと同じマージン */
            border: 1px solid var(--border);
            gap: 2px;
        }
        .tab {
            flex: 1;
            padding: 2px 4px;
            text-align: center;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            background: var(--bg);
            color: var(--text);
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        body[theme="DARK"] .tab.active { background: #4a4a4a; }
        body[theme="BLUE"] .tab.active { background: #3a4a6a; }
        body[theme="PURPLE"] .tab.active { background: #4c3d6a; }
        body[theme="GRAY"] .tab.active { background: #505050; }

        body[theme="LIGHT"] .tab.active, body[theme="LIGHTGRAY"] .tab.active {
            background: var(--bg);
            color: var(--accent);
            border-color: var(--border);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Custom Scrollbar ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* ── Cache Control ── */
        #cache-control {
            margin: 10px 4px 0 4px;
            padding: 0;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        #btn-delete-cache {
            background: none;
            color: var(--text-muted);
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            transition: color 0.2s;
            font-weight: 500;
        }

        #btn-delete-cache:hover {
            color: var(--text);
        }

        /* ── Warning (suspicious node) ── */
        .tab.has-warning { color: #d4860a; }
        .tab.has-warning.active { color: #d4860a; }
        body[theme="DARK"] .tab.has-warning,
        body[theme="GRAY"] .tab.has-warning,
        body[theme="BLUE"] .tab.has-warning,
        body[theme="PURPLE"] .tab.has-warning { color: #f0a832; }

        .warning-card {
            background: rgba(240, 168, 50, 0.1);
            border: 1px solid rgba(240, 168, 50, 0.35);
            border-radius: 6px;
            padding: 10px 12px;
            margin: 0 4px 10px 4px;
        }
        .warning-card-title {
            font-size: 11.5px;
            font-weight: 700;
            color: #d4860a;
            margin-bottom: 8px;
            letter-spacing: 0.01em;
        }
        body[theme="DARK"] .warning-card-title,
        body[theme="GRAY"] .warning-card-title,
        body[theme="BLUE"] .warning-card-title,
        body[theme="PURPLE"] .warning-card-title { color: #f0a832; }

        .warning-node-item {
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(240, 168, 50, 0.2);
        }
        .warning-node-item:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: none; }

        .warning-node-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .warning-node-value {
            font-size: 12px;
            color: var(--text);
            line-height: 1.45;
            word-break: break-word;
        }

        #empty-state { padding: 60px 20px; text-align:center; color:var(--text-muted); font-size:11px; letter-spacing:0.05em; }
    </style>
</head>
<body>
    <div id="filename" style="display:none"></div>
    <div id="content" style="display:none"></div>
    <div id="empty-state"></div>
    <div id="cache-control"></div>

    <!-- Scripts -->
    <script src="js/metadata-parser/utils/ParsingUtils.js"></script>
    <script src="js/metadata-parser/utils/BinaryUtils.js"></script>
    <script src="js/metadata-parser/utils/ErrorHandler.js"></script>
    <script src="js/metadata-parser/utils/Validators.js"></script>
    <script src="js/metadata-parser/utils/MetadataCacheService.js"></script>
    <script src="js/inspector/SuspiciousNodeCategorizer.js"></script>
    <script src="js/metadata-parser/dictionary/NodeDefinitionDictionary.js"></script>
    <script src="js/metadata-parser/reporter/MetadataExtractionReporter.js"></script>
    <script src="js/metadata-parser/errors/ParseError.js"></script>
    <script src="js/metadata-parser/binary-extraction/ImageMetadataReader.js"></script>
    <script src="js/metadata-parser/binary-extraction/FormatDetector.js"></script>
    <script src="js/metadata-parser/graph/ComfyUIGraph.js"></script>
    <script src="js/metadata-parser/graph/ComfyUISamplerAnalyzer.js"></script>
    <script src="js/metadata-parser/parameters/ParameterHandler.js"></script>
    <script src="js/metadata-parser/parameters/StandardParameterHandler.js"></script>
    <script src="js/metadata-parser/parameters/LoraHashHandler.js"></script>
    <script src="js/metadata-parser/parameters/ADetailerHandler.js"></script>
    <script src="js/metadata-parser/parameters/ParameterParser.js"></script>
    <script src="js/metadata-parser/parsers/MetadataParser.js"></script>
    <script src="js/metadata-parser/parsers/ParserRegistry.js"></script>
    <script src="js/metadata-parser/parsers/ComfyUIParser.js"></script>
    <script src="js/metadata-parser/parsers/A1111Parser.js"></script>
    <script src="js/metadata-parser/integration/MetadataService.js"></script>

    <script>
        const fsp = require('fs').promises;
        const path = require('path');

        // Global paths - will be set by eagle.onPluginCreate
        let globalPluginPath = null;
        let globalLibraryPath = null;

        // 翻訳ユーティリティ
        function t(key, r = {}) {
            return window.i18next ? window.i18next.t(key, r) : (r.defaultValue || key);
        }

        const COPY_SVG = `<svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

        async function applyTheme(theme) {
            if (!theme) {
                const params = new URLSearchParams(window.location.search);
                theme = params.get('theme');
                if (!theme && typeof eagle !== 'undefined') theme = await eagle.app.theme;
            }
            if (theme) document.body.setAttribute('theme', theme.toUpperCase());
        }

        applyTheme();

        async function copyText(text, el) {
            try {
                await navigator.clipboard.writeText(text);
                el.classList.add('is-copied');
                setTimeout(() => el.classList.remove('is-copied'), 1000);
            } catch (e) {}
        }

        function createRow(label, value, isMono = false) {
            if (!value && value !== 0) return null;
            const row = document.createElement('div');
            row.className = 'row';

            const labelEl = document.createElement('div');
            labelEl.className = 'row-label';
            labelEl.textContent = String(label);

            const valueEl = document.createElement('div');
            valueEl.className = `row-value${isMono ? ' mono' : ''}`;
            valueEl.textContent = String(value);

            row.appendChild(labelEl);
            row.appendChild(valueEl);
            row.insertAdjacentHTML('beforeend', COPY_SVG);

            const copiedLabel = document.createElement('div');
            copiedLabel.className = 'copied-label';
            copiedLabel.textContent = 'Copied';
            row.appendChild(copiedLabel);

            row.onclick = () => copyText(String(value), row);
            return row;
        }

        // ── Suspicious node i18n keys (translated via t()) ──
        const SUSPICIOUS_REASON_KEYS = {
            'suspiciousNode.reason.imageProcessingNoInput': 'suspiciousNode.reason.imageProcessingNoInput',
            'suspiciousNode.reason.vaeEncodeNoInput':       'suspiciousNode.reason.vaeEncodeNoInput',
            'suspiciousNode.reason.vaeDecodeNoInput':       'suspiciousNode.reason.vaeDecodeNoInput',
            'suspiciousNode.reason.samplerNoInput':         'suspiciousNode.reason.samplerNoInput',
            'suspiciousNode.reason.missingInput':           'suspiciousNode.reason.missingInput',
        };
        const SUSPICIOUS_SUGGESTION_KEYS = {
            'suspiciousNode.suggestion.disconnected':      'suspiciousNode.suggestion.disconnected',
            'suspiciousNode.suggestion.vaeEncodeRequired': 'suspiciousNode.suggestion.vaeEncodeRequired',
            'suspiciousNode.suggestion.vaeDecodeRequired': 'suspiciousNode.suggestion.vaeDecodeRequired',
            'suspiciousNode.suggestion.samplerRequired':   'suspiciousNode.suggestion.samplerRequired',
        };

        function resolveKey(isReason, key, params = {}) {
            const map = isReason ? SUSPICIOUS_REASON_KEYS : SUSPICIOUS_SUGGESTION_KEYS;
            const translationKey = map[key];
            return translationKey ? t(translationKey, params) : key;
        }

        function getSuspiciousNodeHandling(pluginPath) {
            // inspector.html runs in a separate renderer process — localStorage is NOT shared with plugin.js.
            // Read the shared settings file written by plugin.js instead.
            try {
                if (pluginPath) {
                    const data = JSON.parse(require('fs').readFileSync(
                        require('path').join(pluginPath, 'inspector-settings.json'), 'utf8'
                    ));
                    return data.suspiciousNodeHandling || 'exclude';
                }
            } catch (e) {}
            return 'exclude';
        }

        function createWarningCard(suspNodes) {
            const card = document.createElement('div');
            card.className = 'warning-card';

            const title = document.createElement('div');
            title.className = 'warning-card-title';
            title.textContent = t('suspiciousNode.warningCardTitle', { defaultValue: '⚠️ Potentially Unused Node(s)' });
            card.appendChild(title);

            for (const node of suspNodes) {
                const item = document.createElement('div');
                item.className = 'warning-node-item';

                const nodeLabel = document.createElement('div');
                nodeLabel.className = 'warning-node-label';
                nodeLabel.textContent = t('suspiciousNode.nodeLabel', { defaultValue: 'Node' });
                item.appendChild(nodeLabel);

                const nodeVal = document.createElement('div');
                nodeVal.className = 'warning-node-value mono';
                nodeVal.textContent = `${node.nodeType} (ID: ${node.nodeId})`;
                item.appendChild(nodeVal);

                if (node.reasonKey) {
                    const reasonLabel = document.createElement('div');
                    reasonLabel.className = 'warning-node-label';
                    reasonLabel.style.marginTop = '6px';
                    reasonLabel.textContent = t('suspiciousNode.reasonLabel', { defaultValue: 'Reason' });
                    item.appendChild(reasonLabel);

                    const reasonVal = document.createElement('div');
                    reasonVal.className = 'warning-node-value';
                    reasonVal.textContent = resolveKey(true, node.reasonKey, node.reasonParams || {});
                    item.appendChild(reasonVal);
                }

                if (node.suggestionKey) {
                    const suggLabel = document.createElement('div');
                    suggLabel.className = 'warning-node-label';
                    suggLabel.style.marginTop = '6px';
                    suggLabel.textContent = t('suspiciousNode.suggestionLabel', { defaultValue: 'Suggestion' });
                    item.appendChild(suggLabel);

                    const suggVal = document.createElement('div');
                    suggVal.className = 'warning-node-value';
                    suggVal.textContent = resolveKey(false, node.suggestionKey, {});
                    item.appendChild(suggVal);
                }

                card.appendChild(item);
            }

            return card;
        }

        function renderStep(step, metadata, stepWarnings = []) {
            const panel = document.createElement('div');
            const appendTo = (parent, el) => { if(el) parent.appendChild(el); };

            let warningCard = null;
            if (stepWarnings.length > 0) {
                warningCard = createWarningCard(stepWarnings);
                warningCard.style.display = 'none';
                warningCard.dataset.warningId = 'warning-' + Math.random().toString(36).slice(2, 9);
                panel.appendChild(warningCard);
                panel.dataset.warningId = warningCard.dataset.warningId;
            }

            // 1. Prompts
            const promptTitle = document.createElement('div');
            promptTitle.className = 'section-title';
            promptTitle.textContent = t('inspector.prompts', { defaultValue: 'Prompts' });
            panel.appendChild(promptTitle);

            const promptCard = document.createElement('div');
            promptCard.className = 'card';
            appendTo(promptCard, createRow(t('inspector.positive', { defaultValue: 'Positive' }), step.positive));
            appendTo(promptCard, createRow(t('inspector.negative', { defaultValue: 'Negative' }), step.negative));
            if (promptCard.children.length > 0) panel.appendChild(promptCard);

            // 2. Parameters
            const paramTitle = document.createElement('div');
            paramTitle.className = 'section-title';
            paramTitle.textContent = t('inspector.parameters', { defaultValue: 'Parameters' });
            panel.appendChild(paramTitle);

            const paramCard = document.createElement('div');
            paramCard.className = 'card';
            appendTo(paramCard, createRow(t('inspector.seed', { defaultValue: 'Seed' }), step.seed, true));

            const grid1 = document.createElement('div');
            grid1.className = 'grid-row';
            appendTo(grid1, createRow(t('inspector.steps', { defaultValue: 'Steps' }), step.steps, true));
            appendTo(grid1, createRow(t('inspector.cfgScale', { defaultValue: 'CFG Scale' }), step.cfg, true));
            paramCard.appendChild(grid1);

            const grid2 = document.createElement('div');
            grid2.className = 'grid-row';
            appendTo(grid2, createRow(t('inspector.sampler', { defaultValue: 'Sampler' }), step.sampler));
            appendTo(grid2, createRow(t('inspector.scheduler', { defaultValue: 'Scheduler' }), step.scheduler));
            paramCard.appendChild(grid2);

            panel.appendChild(paramCard);

            // 3. Model
            const loraList = (metadata.loras || []).map(l => path.basename(typeof l === 'string' ? l : (l.name || ''))).filter(Boolean);
            const loras = loraList.length > 0 ? loraList.join(', ') : null;

            if (step.checkpoint || loras) {
                const modelTitle = document.createElement('div');
                modelTitle.className = 'section-title';
                modelTitle.textContent = t('inspector.model', { defaultValue: 'Model' });
                panel.appendChild(modelTitle);

                const modelCard = document.createElement('div');
                modelCard.className = 'card';
                if (step.checkpoint) appendTo(modelCard, createRow(t('inspector.checkpoint', { defaultValue: 'Checkpoint' }), path.basename(step.checkpoint)));
                if (loras) appendTo(modelCard, createRow(t('inspector.loras', { defaultValue: 'LoRAs' }), loras));
                panel.appendChild(modelCard);
            }

            return panel;
        }

        function renderMetadata(metadata) {
            const content = document.getElementById('content');
            while (content.firstChild) {
                content.removeChild(content.firstChild);
            }
            content.style.display = 'block';
            document.getElementById('empty-state').style.display = 'none';

            const steps = metadata.generationSteps || [];

            // Categorize suspicious nodes using pure categorizer function
            const categorizer = window.SuspiciousNodeCategorizer;
            const { stepWarningMap, suspSamplerNodes, affectedExcludedMap, orphanNodes } = categorizer.categorizeNodes(metadata);

            if (steps.length >= 1 || (metadata.suspiciousNodes && metadata.suspiciousNodes.length > 0)) {
                const tabBar = document.createElement('div');
                tabBar.className = 'tab-bar';
                const panels = [];
                let tabIndex = 0;

                // Render normal generation steps
                steps.forEach((step, i) => {
                    const tab = document.createElement('div');
                    tab.className = `tab ${tabIndex === 0 ? 'active' : ''}`;
                    const baseLabel = t('inspector.base', { defaultValue: 'Base' });
                    const stepLabel = t('inspector.step', { defaultValue: 'Step' });
                    const tabLabel = step.isBase ? baseLabel : (step.nodeTitle || `${stepLabel} ${i+1}`);
                    const nodeType = step.nodeName || step.nodeType || '';
                    const stepWarnings = stepWarningMap[step.nodeId] || [];

                    if (nodeType) {
                        tab.textContent = tabLabel;
                        if (stepWarnings.length > 0) tab.textContent += ' ⚠️';
                        const br = document.createElement('br');
                        tab.appendChild(br);
                        const subtitle = document.createElement('span');
                        subtitle.style.fontSize = '9px';
                        subtitle.style.opacity = '0.6';
                        subtitle.style.textTransform = 'none';
                        subtitle.textContent = `${nodeType} (ID: ${step.nodeId})`;
                        tab.appendChild(subtitle);
                    } else {
                        tab.textContent = tabLabel;
                        if (stepWarnings.length > 0) tab.textContent += ' ⚠️';
                    }

                    if (stepWarnings.length > 0) {
                        tab.classList.add('has-warning');
                        tab.title = `⚠️ ${stepWarnings.length} suspicious node(s) detected`;
                    }

                    const panel = renderStep(step, metadata, stepWarnings);
                    panel.className = `tab-panel ${tabIndex === 0 ? 'active' : ''}`;
                    panels.push(panel);

                    tab.onclick = () => {
                        tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        panels.forEach(p => p.classList.remove('active'));
                        tab.classList.add('active');
                        panel.classList.add('active');

                        // Toggle warning card visibility on click
                        if (stepWarnings.length > 0 && panel.dataset.warningId) {
                            const warningCard = panel.querySelector('[data-warning-id="' + panel.dataset.warningId + '"]');
                            if (warningCard) {
                                warningCard.style.display = warningCard.style.display === 'none' ? 'block' : 'none';
                            }
                        }
                    };
                    tabBar.appendChild(tab);
                    tabIndex++;
                });

                // Render affected-excluded sampler tabs (samplers excluded from generationSteps due to suspicious upstream)
                for (const [nodeId, entry] of affectedExcludedMap) {
                    const tab = document.createElement('div');
                    tab.className = `tab ${tabIndex === 0 ? 'active' : ''}`;
                    tab.classList.add('has-warning');
                    const nodeType = entry.stepMetadata.nodeName || entry.stepMetadata.nodeType || '';
                    tab.textContent = '⚠️';
                    const br = document.createElement('br');
                    tab.appendChild(br);
                    const subtitle = document.createElement('span');
                    subtitle.style.fontSize = '9px';
                    subtitle.style.opacity = '0.6';
                    subtitle.style.textTransform = 'none';
                    subtitle.textContent = `${nodeType} (ID: ${nodeId})`;
                    tab.appendChild(subtitle);
                    tab.title = `⚠️ Suspicious upstream node`;

                    const panel = renderStep(entry.stepMetadata, metadata, entry.warnings);
                    panel.className = `tab-panel ${tabIndex === 0 ? 'active' : ''}`;
                    panels.push(panel);

                    tab.onclick = () => {
                        tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        panels.forEach(p => p.classList.remove('active'));
                        tab.classList.add('active');
                        panel.classList.add('active');
                        if (panel.dataset.warningId) {
                            const warningCard = panel.querySelector('[data-warning-id="' + panel.dataset.warningId + '"]');
                            if (warningCard) warningCard.style.display = warningCard.style.display === 'none' ? 'block' : 'none';
                        }
                    };
                    tabBar.appendChild(tab);
                    tabIndex++;
                }

                // Render suspicious sampler tabs (suspicious nodes that are themselves samplers)
                suspSamplerNodes.forEach((suspNode, si) => {
                    const tab = document.createElement('div');
                    tab.className = `tab ${tabIndex === 0 ? 'active' : ''}`;
                    tab.classList.add('has-warning');
                    const nodeType = suspNode.stepMetadata.nodeName || suspNode.stepMetadata.nodeType || suspNode.nodeType;
                    tab.textContent = '⚠️';
                    const br = document.createElement('br');
                    tab.appendChild(br);
                    const subtitle = document.createElement('span');
                    subtitle.style.fontSize = '9px';
                    subtitle.style.opacity = '0.6';
                    subtitle.style.textTransform = 'none';
                    subtitle.textContent = `${nodeType} (ID: ${suspNode.nodeId})`;
                    tab.appendChild(subtitle);
                    tab.title = `⚠️ Suspicious sampler`;

                    const warnings = [suspNode];
                    const panel = renderStep(suspNode.stepMetadata, metadata, warnings);
                    panel.className = `tab-panel ${tabIndex === 0 ? 'active' : ''}`;
                    panels.push(panel);

                    tab.onclick = () => {
                        tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        panels.forEach(p => p.classList.remove('active'));
                        tab.classList.add('active');
                        panel.classList.add('active');
                        if (panel.dataset.warningId) {
                            const warningCard = panel.querySelector('[data-warning-id="' + panel.dataset.warningId + '"]');
                            if (warningCard) warningCard.style.display = warningCard.style.display === 'none' ? 'block' : 'none';
                        }
                    };
                    tabBar.appendChild(tab);
                    tabIndex++;
                });

                content.appendChild(tabBar);
                panels.forEach(p => content.appendChild(p));
            } else {
                content.appendChild(renderStep(steps[0] || metadata, metadata));
            }
        }

        // Load settings from file
        async function loadSettings() {
            try {
                // Use global library path to load settings from Eagle's plugin directory
                let libraryPath = globalLibraryPath;
                if (!libraryPath) {
                    const params = new URLSearchParams(window.location.search);
                    libraryPath = params.get('libraryPath');
                }
                if (!libraryPath) {
                    console.log('[Inspector] No library path available, using defaults');
                    return { skipCache: false };
                }

                const settingsPath = path.join(libraryPath, '.eagle', 'plugins', 'comfyui-auto-tagger', 'inspector-settings.json');
                console.log('[Inspector] Reading settings from:', settingsPath);
                const data = JSON.parse(require('fs').readFileSync(settingsPath, 'utf8'));
                console.log('[Inspector] Successfully loaded settings:', data);
                return data;
            } catch (e) {
                console.log('[Inspector] Settings file error (using defaults):', e.message);
                return { skipCache: false };
            }
        }

        async function loadSelected() {
            const params = new URLSearchParams(window.location.search);
            const filePath = params.get('path');
            const itemId = params.get('id');
            if (!filePath) return;

            try {
                // Load settings
                const settings = await loadSettings();
                const skipCacheEnabled = settings.skipCache === true;
                console.log('[Inspector] skipCache from settings file:', skipCacheEnabled);

                // Set initial state message
                document.getElementById('empty-state').textContent = t('inspector.readingMetadata', { defaultValue: 'READING METADATA...' });

                const filenameEl = document.getElementById('filename');
                if (filenameEl) filenameEl.textContent = path.basename(filePath);
                
                // Try cache first
                const libPath = window.MetadataCacheService.resolveLibraryPath(filePath);
                let metadata = null;
                let cacheService = null;

                if (libPath && itemId) {
                    cacheService = new window.MetadataCacheService(libPath);
                    metadata = await cacheService.get(itemId);
                }

                if (metadata) {
                    console.log('[Inspector] Loaded from cache:', itemId);
                    renderMetadata(metadata);
                    return;
                }

                // Cache miss - parse from file
                const buf = await fsp.readFile(filePath);
                const ext = path.extname(filePath).toLowerCase().replace('.', '');
                const mimeMap = { png: 'image/png', webp: 'image/webp', jpg: 'image/jpeg', jpeg: 'image/jpeg' };
                
                const service = new window.MetadataService();
                metadata = service.extractPreferredMetadata(buf, mimeMap[ext] || 'image/png', 'comfyui', {
                    suspiciousNodeHandling: 'exclude'
                });

                if (metadata) {
                    // Extract and log prompt JSON for debugging
                    const buf2 = await fsp.readFile(filePath);
                    const ImageMetadataReader = window.ImageMetadataReader;
                    const rawChunks = ImageMetadataReader.extractRawMetadata(buf2, mimeMap[ext] || 'image/png');
                    if (rawChunks && rawChunks.prompt) {
                        console.log('[Inspector] Prompt JSON structure:', JSON.stringify(rawChunks.prompt, null, 2));
                    }

                    console.log('[Inspector] Extracted metadata:', {
                        format: metadata.format,
                        suspiciousNodesCount: metadata.suspiciousNodes ? metadata.suspiciousNodes.length : 0,
                        suspiciousNodes: metadata.suspiciousNodes
                    });
                    if (metadata.suspiciousNodes) {
                        metadata.suspiciousNodes.forEach(node => {
                            console.log(`[Inspector] Suspicious node ${node.nodeId}: affectedSteps=${node.affectedSteps ? node.affectedSteps.length : 0}`, node.affectedSteps);
                        });
                    }
                    renderMetadata(metadata);
                    // Save to cache for next time (unless skip cache is enabled)
                    console.log('[Inspector] Cache decision:', {
                        skipCacheEnabled: skipCacheEnabled,
                        cacheService: !!cacheService,
                        itemId: itemId,
                        willSave: cacheService && itemId && !skipCacheEnabled
                    });
                    if (cacheService && itemId && !skipCacheEnabled) {
                        await cacheService.set(itemId, metadata);
                        console.log('[Inspector] ✓ Metadata cached for item:', itemId);
                    } else {
                        const reason = !cacheService ? 'no cache service' : !itemId ? 'no itemId' : skipCacheEnabled ? 'skipCache=true' : 'unknown';
                        console.log('[Inspector] ✗ Skipped caching -', reason);
                    }
                } else {
                    document.getElementById('empty-state').textContent = t('inspector.noMetadata', { defaultValue: 'NO METADATA' });
                }

                // Setup cache delete button
                if (itemId && libPath) {
                    const cacheControl = document.getElementById('cache-control');
                    cacheControl.innerHTML = '';
                    const btn = document.createElement('button');
                    btn.id = 'btn-delete-cache';
                    btn.textContent = t('inspector.deleteCache', { defaultValue: '🗑️ Delete Cache' });
                    btn.title = t('inspector.deleteCacheTitle', { defaultValue: 'Delete the cached metadata analysis information for this image' });
                    btn.onclick = async () => {
                        const confirmDeleteCache = t('confirm.clearAllCache', { defaultValue: 'Delete cache for this image?' });
                        if (!confirm(confirmDeleteCache)) return;
                        try {
                            const cacheServiceForDelete = new window.MetadataCacheService(libPath);
                            await cacheServiceForDelete.delete(itemId);
                            console.log('[Inspector] Cache deleted successfully for:', itemId);
                            // Reload metadata from file
                            document.getElementById('content').innerHTML = '';
                            document.getElementById('content').style.display = 'none';
                            document.getElementById('empty-state').textContent = t('inspector.readingMetadata', { defaultValue: 'READING METADATA...' });
                            document.getElementById('empty-state').style.display = 'block';
                            await loadSelected();
                        } catch (e) {
                            console.error('[Inspector] Error deleting cache:', e);
                            const errorMsg = t('log.error.generic', { name: 'Cache', message: e.message });
                            alert(errorMsg);
                        }
                    };
                    cacheControl.appendChild(btn);
                }
            } catch (e) {
                console.error('[Inspector] Error loading metadata:', e);
                document.getElementById('empty-state').textContent = t('inspector.error', { defaultValue: 'ERROR' });
            }
        }

        if (typeof eagle !== 'undefined') {
            eagle.onPluginCreate(async (plugin) => {
                // Store paths globally for use in loadSettings()
                globalPluginPath = plugin.path;
                globalLibraryPath = eagle.library.path;
                console.log('[Inspector] Paths set - plugin:', globalPluginPath, 'library:', globalLibraryPath);

                // Load dictionary using plugin.path to avoid Electron __dirname issues
                try {
                    const dictPath = require('path').join(plugin.path, 'js/metadata-parser/dictionary/default-dictionary.json');
                    const dictData = JSON.parse(require('fs').readFileSync(dictPath, 'utf8'));
                    window.globalDictionary = new window.NodeDefinitionDictionary(dictData);
                } catch (e) {
                    console.warn('[Inspector] Dictionary load failed:', e.message);
                }
                await applyTheme();
                eagle.onThemeChanged(applyTheme);
                loadSelected();
            });
        } else { applyTheme(); loadSelected(); }
    </script>
</body>
</html>
