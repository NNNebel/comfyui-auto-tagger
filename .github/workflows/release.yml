name: Build and Release Eagle Plugin

on:
  push:
    tags:
      - 'v*' # v1.3.0 などのタグがPushされた時に実行

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースへの書き込み権限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Extract Release Notes
        run: |
          # CHANGELOG.md から最新の [##] セクションを抽出して RELEASE_NOTES.md に保存
          # 最初の ## から、次の ## の直前までを切り出す
          sed -n '/^## \[[0-9.]*\]/,/^## \[[0-9.]*\]/p' CHANGELOG.md | sed '$d' > RELEASE_NOTES.md

      - name: Create Eagle Plugin Package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          FILENAME="ComfyUI-Auto-Tagger-${TAG_NAME}.eagleplugin"

          mkdir -p dist/js dist/_locales

          cp index.html manifest.json logo.png LICENSE dist/
          cp js/core.js js/plugin.js dist/js/
          cp _locales/*.json dist/_locales/

          cd dist
          zip -r "../${FILENAME}" ./*
          cd ..

          echo "RELEASE_FILENAME=${FILENAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.RELEASE_FILENAME }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}