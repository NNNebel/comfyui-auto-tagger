name: Build and Release Eagle Plugin

on:
  push:
    tags:
      - 'v*' # v1.3.0 などのタグがPushされた時に実行

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースへの書き込み権限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Extract Release Notes
        run: |
          # Extract the section matching the pushed tag, including letter suffixes.
          VERSION=${GITHUB_REF_NAME#v}
          awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 {found=1; print; next} found && /^## / {exit} found' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Create Eagle Plugin Package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          FILENAME="ComfyUI-Auto-Tagger-${TAG_NAME}.eagleplugin"

          # Create directory structure for plugin
          mkdir -p dist

          # Share runtime contents with the local prerelease build
          node scripts/stage-plugin.js

          # Create plugin package
          cd dist
          zip -r "../${FILENAME}" ./*
          cd ..

          echo "RELEASE_FILENAME=${FILENAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.RELEASE_FILENAME }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
