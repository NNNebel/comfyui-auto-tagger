<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Auto Tagger</title>
    <style>
        :root {
            --bg-color: #2c2c2c;
            --text-color: #eeeeee;
            --border-color: #444444;
            --accent-color: #0d6efd;
            --button-text: #ffffff;
            --log-bg: #1e1e1e;
            --secondary-text: #aaaaaa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px 20px; /* 上下のpaddingを少し減らすか、全体で調整 */
            font-size: 13px;
        }

        h1 {
            font-size: 16px;
            margin-bottom: 15px; /* マージンを調整 */
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px; /* パディングを調整 */
            margin-top: 0;
        }

        .debug-option {
            position: absolute;
            top: 15px; /* 上の位置を調整 */
            right: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            opacity: 0.8;
            color: var(--secondary-text);
        }
        .debug-option label {
            cursor: pointer;
            margin-left: 4px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 6px; /* マージンを調整 */
            font-size: 13px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-top: 15px;
            color: var(--text-color);
        }

        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px; /* ギャップを調整 */
        }

        .option-group {
            display: flex;
            align-items: center;
            margin-bottom: 4px; /* オプショングループ間のマージン */
        }

        .option-group input[type="checkbox"] {
            margin-right: 6px;
        }
        
        .option-group input[type="number"] {
            width: 50px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 3px;
            padding: 2px 4px;
        }

        label {
            cursor: pointer;
            user-select: none;
            color: var(--text-color);
        }

        #controls {
            margin-top: 15px; /* マージンを調整 */
            padding-top: 10px; /* パディングを調整 */
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: #777; cursor: not-allowed; opacity: 0.7; }
        
        #deleteInfoButton { background-color: #dc3545; }
        #cancelButton { background-color: #6c757d; }

        #progress-container {
            width: 100%;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px; /* マージンを調整 */
            height: 24px;
            position: relative;
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        #progress-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: var(--button-text);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        #log .log-caution {
            color: #ffc107;
            font-weight: bold;
        }

        #log {
            margin-top: 10px;
            padding: 10px;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            min-height: calc(1.5em * 5); /* Minimum 5 lines visible */
            max-height: calc(1.5em * 5); /* Maximum 5 lines visible */
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Warning section styles */
        #warning-section {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background-color: #3a2f1f;
            border: 1px solid #ffc107;
            border-radius: 4px;
            font-size: 12px;
        }

        #warning-section.visible {
            display: block;
        }

        .warning-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffc107;
        }

        .warning-icon {
            font-size: 16px;
        }

        .warning-content {
            margin-left: 24px;
            color: var(--text-color);
            line-height: 1.6;
        }

        .warning-node {
            margin: 8px 0;
            padding: 8px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .warning-node-id {
            font-weight: bold;
            color: #ffc107;
        }

        .warning-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .warning-button {
            padding: 6px 12px;
            border-radius: 3px;
            border: 1px solid var(--border-color);
            background-color: var(--log-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.2s;
        }

        .warning-button:hover {
            background-color: #3a3a3a;
        }

        .warning-button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--button-text);
        }

        .warning-button.primary:hover {
            background-color: #0b5ed7;
        }

        .warning-dismiss {
            margin-left: auto;
            background-color: transparent;
            border: none;
            color: var(--secondary-text);
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
        }

        .warning-dismiss:hover {
            color: var(--text-color);
        }

        /* Suspicious node confirmation dialog */
        #suspicious-node-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #suspicious-node-dialog.visible {
            display: flex;
        }

        .dialog-content {
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .dialog-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            color: #ffc107;
        }

        .dialog-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .dialog-info {
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .dialog-node-info {
            background-color: var(--log-bg);
            padding: 12px;
            border-radius: 4px;
            margin: 12px 0;
            border-left: 3px solid #ffc107;
        }

        .dialog-node-id {
            font-weight: bold;
            color: #ffc107;
            font-size: 14px;
        }

        .dialog-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .dialog-button {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .dialog-button:hover {
            opacity: 0.9;
        }

        .dialog-button.include {
            background-color: #28a745;
            color: white;
        }

        .dialog-button.exclude {
            background-color: #dc3545;
            color: white;
        }

        .dialog-button.include-all {
            background-color: var(--accent-color);
            color: white;
        }

        .dialog-button.exclude-all {
            background-color: #6c757d;
            color: white;
        }

        .dialog-progress {
            text-align: center;
            color: var(--secondary-text);
            font-size: 12px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="debug-option">
        <input type="checkbox" id="chk-debug-log">
        <label for="chk-debug-log">Debug Mode</label>
    </div>

    <h1>ComfyUI Auto Tagger</h1>

    <div class="section-title">出力設定</div>
    <div style="display: flex; gap: 20px; margin-bottom: 10px;">
        <div class="option-group">
            <input type="checkbox" id="chk-add-tags" checked>
            <label for="chk-add-tags">タグに追加</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-write-notes" checked>
            <label for="chk-write-notes">メモに追加</label>
        </div>
        <div class="option-group">
            <label for="chunk-size">一度に処理する数:</label>
            <input type="number" id="chunk-size" value="5" min="1" max="50">
        </div>
    </div>

    <div class="section-title" data-i18n="ui.suspiciousNodeHandling">疑わしいノードの処理</div>
    <div style="display: flex; gap: 20px; margin-bottom: 10px; align-items: center;">
        <div class="option-group">
            <label for="suspicious-node-handling" data-i18n="ui.processingMethod">処理方法:</label>
            <select id="suspicious-node-handling" style="margin-left: 8px; padding: 4px 8px; background-color: var(--log-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 3px;">
                <option value="exclude" data-i18n="ui.option.exclude">除外する</option>
                <option value="ask" data-i18n="ui.option.ask">確認する</option>
                <option value="include" data-i18n="ui.option.include">含める</option>
            </select>
        </div>
        <div style="font-size: 11px; color: var(--secondary-text);" data-i18n="ui.suspiciousNodeDescription">
            必須入力が欠けているノードの扱いを選択
        </div>
    </div>

    <div class="section-title" data-i18n="ui.extractionTarget">取得対象</div>
    <div class="option-grid">
        <div class="option-group">
            <input type="checkbox" id="chk-checkpoint" checked>
            <label for="chk-checkpoint">Checkpoint</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-lora" checked>
            <label for="chk-lora">LoRA</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-positive" checked>
            <label for="chk-positive">Positive</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-negative">
            <label for="chk-negative">Negative</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-seed">
            <label for="chk-seed">Seed</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-sampler">
            <label for="chk-sampler">Sampler</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-scheduler">
            <label for="chk-scheduler">Scheduler</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-steps">
            <label for="chk-steps">Steps</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-cfg">
            <label for="chk-cfg">CFG</label>
        </div>
    </div>

    <div id="controls">
        <button id="startButton">タグ付け開始</button>
        <button id="deleteInfoButton">情報を削除</button>
        <button id="cancelButton" style="display:none;">キャンセル</button>
    </div>
    
    <div id="progress-container">
        <div id="progress-bar"></div>
        <div id="progress-text">0 / 0</div>
    </div>

    <!-- Warning section for suspicious nodes -->
    <div id="warning-section">
        <div class="warning-header">
            <span class="warning-icon">⚠️</span>
            <span>ワークフローに問題が検出されました</span>
            <button class="warning-dismiss" onclick="dismissWarning()" title="閉じる">×</button>
        </div>
        <div class="warning-content">
            <div id="warning-message"></div>
            <div class="warning-actions">
                <button class="warning-button primary" onclick="includeAllNodes()">すべてのノードを含める</button>
                <button class="warning-button" onclick="showWarningDetails()">詳細を表示</button>
                <button class="warning-button" onclick="copyWarningInfo()">情報をコピー</button>
            </div>
        </div>
    </div>

    <div id="log"></div>

    <!-- Suspicious node confirmation dialog -->
    <div id="suspicious-node-dialog">
        <div class="dialog-content">
            <div class="dialog-header" data-i18n="ui.dialog.title">⚠️ 疑わしいノードが検出されました</div>
            <div class="dialog-progress" id="dialog-progress"></div>
            <img id="dialog-image" class="dialog-image" data-i18n="[alt]ui.dialog.imagePreview" alt="画像プレビュー">
            <div class="dialog-info">
                <div><strong data-i18n="ui.dialog.filename">ファイル名:</strong> <span id="dialog-filename"></span></div>
                <div class="dialog-node-info">
                    <div class="dialog-node-id" id="dialog-node-id"></div>
                    <div style="margin-top: 8px;" id="dialog-node-reason"></div>
                    <div style="margin-top: 8px; font-size: 11px; color: var(--secondary-text);" id="dialog-node-suggestion"></div>
                    <div style="margin-top: 12px; padding: 8px; background-color: rgba(255, 193, 7, 0.1); border-left: 3px solid #ffc107; border-radius: 3px;" id="dialog-affected-steps"></div>
                </div>
            </div>
            <div class="dialog-actions">
                <button class="dialog-button exclude" id="btn-exclude-node" data-i18n="ui.dialog.excludeNode">このノードを除外</button>
                <button class="dialog-button include" id="btn-include-node" data-i18n="ui.dialog.includeNode">このノードを含める</button>
                <button class="dialog-button exclude-all" id="btn-exclude-image" data-i18n="ui.dialog.excludeImage">この画像は全て除外</button>
                <button class="dialog-button include-all" id="btn-include-image" data-i18n="ui.dialog.includeImage">この画像は全て含める</button>
            </div>
            <div style="text-align: center; margin-top: 8px; font-size: 11px; color: var(--secondary-text);" data-i18n="ui.dialog.shiftHint">
                💡 Shiftキーを押しながらクリックすると、残りの全画像に適用されます
            </div>
        </div>
    </div>

    <!-- Utility Modules (must load first) -->
    <script src="js/metadata-parser/utils/ParsingUtils.js"></script>
    <script src="js/metadata-parser/utils/BinaryUtils.js"></script>
    <script src="js/metadata-parser/utils/ErrorHandler.js"></script>
    <script src="js/metadata-parser/utils/Validators.js"></script>
    
    <!-- Error Types -->
    <script src="js/metadata-parser/errors/ParseError.js"></script>
    
    <!-- Binary Extraction Layer -->
    <script src="js/metadata-parser/binary-extraction/ImageMetadataReader.js"></script>
    <script src="js/metadata-parser/binary-extraction/FormatDetector.js"></script>
    
    <!-- Graph Layer (for ComfyUI) -->
    <script src="js/metadata-parser/graph/ComfyUIGraph.js"></script>
    <script src="js/metadata-parser/graph/ComfyUISamplerAnalyzer.js"></script>
    
    <!-- Parameter Parsing Layer (for A1111) -->
    <script src="js/metadata-parser/parameters/ParameterHandler.js"></script>
    <script src="js/metadata-parser/parameters/StandardParameterHandler.js"></script>
    <script src="js/metadata-parser/parameters/LoraHashHandler.js"></script>
    <script src="js/metadata-parser/parameters/ADetailerHandler.js"></script>
    <script src="js/metadata-parser/parameters/ParameterParser.js"></script>
    
    <!-- Prompt Tokenization Layer -->
    <script src="js/metadata-parser/prompt/PromptToken.js"></script>
    <script src="js/metadata-parser/prompt/PromptTokenizer.js"></script>
    
    <!-- Parser Layer -->
    <script src="js/metadata-parser/parsers/MetadataParser.js"></script>
    <script src="js/metadata-parser/parsers/ParserRegistry.js"></script>
    <script src="js/metadata-parser/parsers/ComfyUIParser.js"></script>
    <script src="js/metadata-parser/parsers/A1111Parser.js"></script>
    
    <!-- Integration Layer -->
    <script src="js/metadata-parser/integration/MetadataService.js"></script>
    
    <!-- Processing Layer -->
    <script src="js/metadata-processor/TagGenerator.js"></script>
    <script src="js/metadata-processor/AnnotationBuilder.js"></script>
    <script src="js/metadata-processor/MetadataProcessor.js"></script>
    
    <!-- Legacy core.js for processMetadata -->
    <script src="js/core.js"></script>
    <script src="js/plugin.js"></script>
    
    <script>
        // Suspicious node handling
        let suspiciousNodeQueue = [];
        let currentSuspiciousNodeIndex = 0;
        let suspiciousNodeDecisions = {};
        let suspiciousNodeResolve = null;
        let currentImageItem = null; // Store current image item
        let globalSuspiciousNodeDecision = null; // Store global decision (null, 'exclude', 'include')

        function getSuspiciousNodeHandling() {
            const select = document.getElementById('suspicious-node-handling');
            return select ? select.value : 'exclude';
        }

        async function handleSuspiciousNodes(imageItem, suspiciousNodes) {
            const handling = getSuspiciousNodeHandling();
            
            console.log('[DEBUG] handleSuspiciousNodes called for:', imageItem.name);
            console.log('[DEBUG] globalSuspiciousNodeDecision:', globalSuspiciousNodeDecision);
            console.log('[DEBUG] handling mode:', handling);
            
            // Check if there's a global decision from previous dialog
            if (globalSuspiciousNodeDecision) {
                console.log('[DEBUG] Using global decision:', globalSuspiciousNodeDecision, 'for image:', imageItem.name);
                return { action: globalSuspiciousNodeDecision, overrides: {} };
            }
            
            if (handling === 'exclude') {
                // Exclude without logging (plugin.js will log)
                console.log('[DEBUG] Using exclude mode (no dialog)');
                return { action: 'exclude', overrides: {} };
            } else if (handling === 'include') {
                // Include all without asking
                console.log('[DEBUG] Using include mode (no dialog)');
                return { action: 'include', overrides: {} };
            } else if (handling === 'ask') {
                // Show dialog for each suspicious node
                console.log('[DEBUG] Showing dialog for:', imageItem.name);
                return await showSuspiciousNodeDialog(imageItem, suspiciousNodes);
            }
        }

        async function showSuspiciousNodeDialog(imageItem, suspiciousNodes) {
            return new Promise((resolve) => {
                suspiciousNodeQueue = suspiciousNodes;
                currentSuspiciousNodeIndex = 0;
                suspiciousNodeDecisions = {};
                suspiciousNodeResolve = resolve;
                currentImageItem = imageItem; // Store image item
                
                showNextSuspiciousNode();
            });
        }

        function showNextSuspiciousNode() {
            if (currentSuspiciousNodeIndex >= suspiciousNodeQueue.length) {
                // All nodes processed
                document.getElementById('suspicious-node-dialog').classList.remove('visible');
                
                // Resize window back to normal when dialog is closed
                console.log('[DEBUG] Resizing window back to 610px');
                if (typeof eagle !== 'undefined' && eagle.window) {
                    try {
                        eagle.window.setSize(640, 610);
                        console.log('[DEBUG] Window resized to 640x610');
                    } catch (e) {
                        console.log('Window resize not supported:', e);
                    }
                }
                
                // Determine final action
                const decisions = Object.values(suspiciousNodeDecisions);
                const hasInclude = decisions.some(d => d === 'include');
                const hasExclude = decisions.some(d => d === 'exclude');
                
                let overrides = {};
                for (const [nodeId, decision] of Object.entries(suspiciousNodeDecisions)) {
                    if (decision === 'include') {
                        overrides[nodeId] = { forceInclude: true };
                    } else if (decision === 'exclude') {
                        overrides[nodeId] = { forceExclude: true };
                    }
                }
                
                // Determine base action: if all are the same, use that; otherwise use 'exclude' as default
                let baseAction = 'exclude';
                if (hasInclude && !hasExclude) {
                    baseAction = 'include';
                } else if (!hasInclude && hasExclude) {
                    baseAction = 'exclude';
                }
                
                if (suspiciousNodeResolve) {
                    suspiciousNodeResolve({ 
                        action: baseAction,
                        overrides: overrides
                    });
                    suspiciousNodeResolve = null;
                }
                currentImageItem = null; // Clear image item
                return;
            }

            const node = suspiciousNodeQueue[currentSuspiciousNodeIndex];
            const dialog = document.getElementById('suspicious-node-dialog');
            
            // Update progress
            document.getElementById('dialog-progress').textContent = 
                `${currentSuspiciousNodeIndex + 1} / ${suspiciousNodeQueue.length}`;
            
            // Update image
            const img = document.getElementById('dialog-image');
            img.src = currentImageItem.url || currentImageItem.filePath;
            
            // Update filename
            document.getElementById('dialog-filename').textContent = currentImageItem.name;
            
            // Update node info
            const nodeInfoText = window.i18next 
                ? window.i18next.t('ui.dialog.nodeInfo', { nodeId: node.nodeId, nodeType: node.nodeType || 'Unknown' })
                : `ノード #${node.nodeId} (${node.nodeType || 'Unknown'})`;
            document.getElementById('dialog-node-id').textContent = nodeInfoText;
            
            // Translate reason and suggestion using i18next
            const reason = node.reasonKey 
                ? (window.i18next ? window.i18next.t(node.reasonKey, node.reasonParams || {}) : node.reasonKey)
                : (node.reason || '');
            const suggestion = node.suggestionKey 
                ? (window.i18next ? window.i18next.t(node.suggestionKey) : node.suggestionKey)
                : (node.suggestion || '');
            
            document.getElementById('dialog-node-reason').textContent = reason;
            document.getElementById('dialog-node-suggestion').textContent = suggestion;
            
            // Display affected steps if available
            const affectedStepsDiv = document.getElementById('dialog-affected-steps');
            if (node.affectedSteps && node.affectedSteps.length > 0) {
                const stepsText = node.affectedSteps.map(step => 
                    `Step ${step.stepIndex} - ${step.stepNodeType} (ID: ${step.stepNodeId})`
                ).join(', ');
                const affectedText = window.i18next 
                    ? window.i18next.t('ui.dialog.affectedSteps', { steps: stepsText })
                    : `影響を受けるステップ: ${stepsText}`;
                affectedStepsDiv.textContent = affectedText;
                affectedStepsDiv.style.display = 'block';
            } else {
                affectedStepsDiv.style.display = 'none';
            }
            
            dialog.classList.add('visible');
            
            // Resize window when dialog is shown
            console.log('[DEBUG] Resizing window to 900px for dialog');
            if (typeof eagle !== 'undefined' && eagle.window) {
                try {
                    eagle.window.setSize(640, 900);
                    console.log('[DEBUG] Window resized to 640x900');
                } catch (e) {
                    console.log('Window resize not supported:', e);
                }
            }
        }

        function handleNodeDecision(event, decision, scope) {
            const node = suspiciousNodeQueue[currentSuspiciousNodeIndex];
            const isShiftPressed = event && event.shiftKey;
            
            console.log('[DEBUG] handleNodeDecision called:', {
                decision: decision,
                scope: scope,
                isShiftPressed: isShiftPressed,
                nodeId: node.nodeId
            });
            
            if (scope === 'node') {
                // Apply to current node only
                suspiciousNodeDecisions[node.nodeId] = decision;
                currentSuspiciousNodeIndex++;
                
                if (isShiftPressed) {
                    // Shift key pressed: Apply to all remaining images
                    console.log('[DEBUG] Setting global decision (node scope):', decision);
                    globalSuspiciousNodeDecision = decision;
                }
            } else if (scope === 'image') {
                // Apply to all remaining nodes in current image
                for (let i = currentSuspiciousNodeIndex; i < suspiciousNodeQueue.length; i++) {
                    suspiciousNodeDecisions[suspiciousNodeQueue[i].nodeId] = decision;
                }
                currentSuspiciousNodeIndex = suspiciousNodeQueue.length;
                
                if (isShiftPressed) {
                    // Shift key pressed: Apply to all remaining images
                    console.log('[DEBUG] Setting global decision (image scope):', decision);
                    globalSuspiciousNodeDecision = decision;
                }
            }
            
            // Show next node
            showNextSuspiciousNode();
        }

        // Export for use in plugin.js
        window.handleSuspiciousNodes = handleSuspiciousNodes;
        window.getSuspiciousNodeHandling = getSuspiciousNodeHandling;
        window.resetGlobalSuspiciousNodeDecision = function() {
            console.log('[DEBUG] Resetting global decision');
            globalSuspiciousNodeDecision = null;
        };
        
        // Add event listeners to dialog buttons
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('btn-exclude-node').addEventListener('click', function(e) {
                handleNodeDecision(e, 'exclude', 'node');
            });
            document.getElementById('btn-include-node').addEventListener('click', function(e) {
                handleNodeDecision(e, 'include', 'node');
            });
            document.getElementById('btn-exclude-image').addEventListener('click', function(e) {
                handleNodeDecision(e, 'exclude', 'image');
            });
            document.getElementById('btn-include-image').addEventListener('click', function(e) {
                handleNodeDecision(e, 'include', 'image');
            });
        });
        
        // Update chunk size input state based on suspicious node handling
        function updateChunkSizeState() {
            const select = document.getElementById('suspicious-node-handling');
            const chunkSizeInput = document.getElementById('chunk-size');
            const chunkSizeLabel = document.querySelector('label[for="chunk-size"]');
            
            if (select && chunkSizeInput) {
                const isAskMode = select.value === 'ask';
                chunkSizeInput.disabled = isAskMode;
                
                // Update visual style
                if (isAskMode) {
                    chunkSizeInput.style.opacity = '0.5';
                    chunkSizeInput.style.cursor = 'not-allowed';
                    if (chunkSizeLabel) {
                        chunkSizeLabel.style.opacity = '0.5';
                    }
                } else {
                    chunkSizeInput.style.opacity = '1';
                    chunkSizeInput.style.cursor = 'text';
                    if (chunkSizeLabel) {
                        chunkSizeLabel.style.opacity = '1';
                    }
                }
            }
        }
        
        // Add event listener to suspicious node handling select
        const suspiciousNodeHandlingSelect = document.getElementById('suspicious-node-handling');
        if (suspiciousNodeHandlingSelect) {
            suspiciousNodeHandlingSelect.addEventListener('change', updateChunkSizeState);
        }
        
        // Initialize state on page load
        document.addEventListener('DOMContentLoaded', updateChunkSizeState);
        // Also call immediately in case DOMContentLoaded already fired
        updateChunkSizeState();
    </script>
</body>
</html>
