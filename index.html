<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Auto Tagger</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --accent-color: #007bff;
            --button-text: #ffffff;
            --log-bg: #f5f5f5;
            --secondary-text: #666666;
        }

        /* Eagleのダークモード自動適用 */
        html[data-theme="dark"], body[data-theme="dark"] {
            --bg-color: #2c2c2c;
            --text-color: #eeeeee;
            --border-color: #444444;
            --accent-color: #0d6efd;
            --log-bg: #1e1e1e;
            --secondary-text: #aaaaaa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 13px;
        }

        h1 {
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* デバッグオプション（右上） */
        .debug-option {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            opacity: 0.8;
            color: var(--secondary-text); /* ダークモード対応 */
        }
        .debug-option label {
            cursor: pointer;
            margin-left: 4px;
        }

        /* 設定グループ */
        .section-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 13px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-top: 15px;
            color: var(--text-color); /* ダークモード対応 */
        }

        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2列表示 */
            gap: 8px;
        }

        .option-group {
            display: flex;
            align-items: center;
        }

        .option-group input[type="checkbox"] {
            margin-right: 6px;
        }

        label {
            cursor: pointer;
            user-select: none;
            color: var(--text-color); /* ダークモード対応 */
        }

        /* ボタン */
        #controls {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: #777; cursor: not-allowed; opacity: 0.7; }
        
        #deleteInfoButton { background-color: #dc3545; }
        #cancelButton { background-color: #6c757d; }

        /* ログエリア */
        #log {
            margin-top: 20px;
            padding: 10px;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="debug-option">
        <input type="checkbox" id="chk-debug-log">
        <label for="chk-debug-log">Debug Mode</label>
    </div>

    <h1>ComfyUI Auto Tagger</h1>

    <div class="section-title">出力設定</div>
    <div style="display: flex; gap: 20px; margin-bottom: 10px;">
        <div class="option-group">
            <input type="checkbox" id="chk-add-tags" checked>
            <label for="chk-add-tags">タグに追加</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-write-notes" checked>
            <label for="chk-write-notes">メモに追加</label>
        </div>
    </div>

    <div class="section-title">取得対象</div>
    <div class="option-grid">
        <div class="option-group">
            <input type="checkbox" id="chk-checkpoint" checked>
            <label for="chk-checkpoint">Checkpoint</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-lora" checked>
            <label for="chk-lora">LoRA</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-positive" checked>
            <label for="chk-positive">Positive</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-negative">
            <label for="chk-negative">Negative</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-seed">
            <label for="chk-seed">Seed</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-sampler">
            <label for="chk-sampler">Sampler</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-steps">
            <label for="chk-steps">Steps</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-cfg">
            <label for="chk-cfg">CFG</label>
        </div>
    </div>

    <div id="controls">
        <button id="startButton">タグ付け開始</button>
        <button id="deleteInfoButton">情報を削除</button>
        <button id="cancelButton" style="display:none;">キャンセル</button>
    </div>

    <div id="log"></div>

    <script src="js/plugin.js"></script>
</body>
</html>
