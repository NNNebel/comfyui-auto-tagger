<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Auto Tagger</title>
    <style>
        :root {
            --bg-color: #2c2c2c;
            --text-color: #eeeeee;
            --border-color: #444444;
            --accent-color: #0d6efd;
            --button-text: #ffffff;
            --log-bg: #1e1e1e;
            --secondary-text: #aaaaaa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px 20px; /* 上下のpaddingを少し減らすか、全体で調整 */
            font-size: 13px;
        }

        h1 {
            font-size: 16px;
            margin-bottom: 15px; /* マージンを調整 */
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px; /* パディングを調整 */
            margin-top: 0;
        }

        .debug-option {
            position: absolute;
            top: 15px; /* 上の位置を調整 */
            right: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            opacity: 0.8;
            color: var(--secondary-text);
        }
        .debug-option label {
            cursor: pointer;
            margin-left: 4px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 6px; /* マージンを調整 */
            font-size: 13px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-top: 15px;
            color: var(--text-color);
        }

        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px; /* ギャップを調整 */
        }

        .option-group {
            display: flex;
            align-items: center;
            margin-bottom: 4px; /* オプショングループ間のマージン */
        }

        .option-group input[type="checkbox"] {
            margin-right: 6px;
        }
        
        .option-group input[type="number"] {
            width: 50px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 3px;
            padding: 2px 4px;
        }

        label {
            cursor: pointer;
            user-select: none;
            color: var(--text-color);
        }

        #controls {
            margin-top: 15px; /* マージンを調整 */
            padding-top: 10px; /* パディングを調整 */
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: #777; cursor: not-allowed; opacity: 0.7; }
        
        #deleteInfoButton { background-color: #dc3545; }
        #cancelButton { background-color: #6c757d; }

        #progress-container {
            width: 100%;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px; /* マージンを調整 */
            height: 24px;
            position: relative;
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        #progress-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: var(--button-text);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        #log {
            margin-top: 10px;
            padding: 10px;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            height: 130px; /* ログエリアの高さは維持 */
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="debug-option">
        <input type="checkbox" id="chk-debug-log">
        <label for="chk-debug-log">Debug Mode</label>
    </div>

    <h1>ComfyUI Auto Tagger</h1>

    <div class="section-title">出力設定</div>
    <div style="display: flex; gap: 20px; margin-bottom: 10px;">
        <div class="option-group">
            <input type="checkbox" id="chk-add-tags" checked>
            <label for="chk-add-tags">タグに追加</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-write-notes" checked>
            <label for="chk-write-notes">メモに追加</label>
        </div>
        <div class="option-group">
            <label for="chunk-size">一度に処理する数:</label>
            <input type="number" id="chunk-size" value="5" min="1" max="50">
        </div>
    </div>

    <div class="section-title">取得対象</div>
    <div class="option-grid">
        <div class="option-group">
            <input type="checkbox" id="chk-checkpoint" checked>
            <label for="chk-checkpoint">Checkpoint</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-lora" checked>
            <label for="chk-lora">LoRA</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-positive" checked>
            <label for="chk-positive">Positive</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-negative">
            <label for="chk-negative">Negative</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-seed">
            <label for="chk-seed">Seed</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-sampler">
            <label for="chk-sampler">Sampler</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-steps">
            <label for="chk-steps">Steps</label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-cfg">
            <label for="chk-cfg">CFG</label>
        </div>
    </div>

    <div id="controls">
        <button id="startButton">タグ付け開始</button>
        <button id="deleteInfoButton">情報を削除</button>
        <button id="cancelButton" style="display:none;">キャンセル</button>
    </div>
    
    <div id="progress-container">
        <div id="progress-bar"></div>
        <div id="progress-text">0 / 0</div>
    </div>

    <div id="log"></div>

    <script src="js/core.js"></script>
    <script src="js/plugin.js"></script>
</body>
</html>
