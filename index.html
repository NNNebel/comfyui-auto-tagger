<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Auto Tagger</title>
    <style>
        :root {
            --bg-color: #2c2c2c;
            --text-color: #eeeeee;
            --border-color: #444444;
            --accent-color: #0d6efd;
            --button-text: #ffffff;
            --log-bg: #1e1e1e;
            --secondary-text: #aaaaaa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px 20px; /* 上下のpaddingを少し減らすか、全体で調整 */
            font-size: 13px;
        }

        h1 {
            font-size: 16px;
            margin-bottom: 15px; /* マージンを調整 */
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px; /* パディングを調整 */
            margin-top: 0;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 6px; /* マージンを調整 */
            font-size: 13px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-top: 15px;
            color: var(--text-color);
        }

        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px; /* ギャップを調整 */
        }

        .option-group {
            display: flex;
            align-items: center;
            margin-bottom: 4px; /* オプショングループ間のマージン */
        }

        .option-group input[type="checkbox"] {
            margin-right: 6px;
        }
        
        .option-group input[type="number"] {
            width: 50px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 3px;
            padding: 2px 4px;
        }

        label {
            cursor: pointer;
            user-select: none;
            color: var(--text-color);
        }

        #controls {
            margin-top: 15px; /* マージンを調整 */
            padding-top: 10px; /* パディングを調整 */
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: #777; cursor: not-allowed; opacity: 0.7; }
        
        #deleteInfoButton { background-color: #dc3545; }
        #cancelButton { background-color: #6c757d; }

        #progress-container {
            width: 100%;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px; /* マージンを調整 */
            height: 24px;
            position: relative;
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        #progress-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: var(--button-text);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        #log .log-caution {
            color: #ffc107;
            font-weight: bold;
        }

        #log {
            margin-top: 10px;
            padding: 10px;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            min-height: calc(1.5em * 5); /* Minimum 5 lines visible */
            max-height: calc(1.5em * 5); /* Maximum 5 lines visible */
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Warning section styles */
        #warning-section {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background-color: #3a2f1f;
            border: 1px solid #ffc107;
            border-radius: 4px;
            font-size: 12px;
        }

        #warning-section.visible {
            display: block;
        }

        .warning-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffc107;
        }

        .warning-icon {
            font-size: 16px;
        }

        .warning-content {
            margin-left: 24px;
            color: var(--text-color);
            line-height: 1.6;
        }

        .warning-node {
            margin: 8px 0;
            padding: 8px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .warning-node-id {
            font-weight: bold;
            color: #ffc107;
        }

        .warning-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .warning-button {
            padding: 6px 12px;
            border-radius: 3px;
            border: 1px solid var(--border-color);
            background-color: var(--log-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.2s;
        }

        .warning-button:hover {
            background-color: #3a3a3a;
        }

        .warning-button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--button-text);
        }

        .warning-button.primary:hover {
            background-color: #0b5ed7;
        }

        .warning-dismiss {
            margin-left: auto;
            background-color: transparent;
            border: none;
            color: var(--secondary-text);
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
        }

        .warning-dismiss:hover {
            color: var(--text-color);
        }

        /* Suspicious node confirmation dialog */
        #suspicious-node-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #suspicious-node-dialog.visible {
            display: flex;
        }

        .dialog-content {
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .dialog-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            color: #ffc107;
        }

        .dialog-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            background-color: var(--log-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .dialog-info {
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .dialog-node-info {
            background-color: var(--log-bg);
            padding: 12px;
            border-radius: 4px;
            margin: 12px 0;
            border-left: 3px solid #ffc107;
        }

        .dialog-node-id {
            font-weight: bold;
            color: #ffc107;
            font-size: 14px;
        }

        .dialog-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .dialog-button {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .dialog-button:hover {
            opacity: 0.9;
        }

        .dialog-button.include {
            background-color: #28a745;
            color: white;
        }

        .dialog-button.exclude {
            background-color: #dc3545;
            color: white;
        }

        .dialog-button.include-all {
            background-color: var(--accent-color);
            color: white;
        }

        .dialog-button.exclude-all {
            background-color: #6c757d;
            color: white;
        }

        .dialog-progress {
            text-align: center;
            color: var(--secondary-text);
            font-size: 12px;
            margin-bottom: 12px;
        }

        /* Settings button */
        .settings-button {
            position: absolute;
            top: 15px;
            right: 20px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.2s;
        }

        .settings-button:hover {
            background-color: var(--border-color);
        }

        /* Settings dialog */
        #settings-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #settings-dialog.visible {
            display: flex;
        }

        .settings-content {
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .settings-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-close {
            background-color: transparent;
            border: none;
            color: var(--secondary-text);
            cursor: pointer;
            font-size: 24px;
            padding: 0;
            line-height: 1;
        }

        .settings-close:hover {
            color: var(--text-color);
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-color);
        }

        .settings-description {
            font-size: 11px;
            color: var(--secondary-text);
            margin-left: 20px;
            margin-top: 4px;
            line-height: 1.4;
        }
        
        .settings-button-action {
            transition: opacity 0.2s, background-color 0.2s;
        }
        
        .settings-button-action:hover {
            opacity: 0.9;
            background-color: #0b5ed7;
        }
        
        /* Hard Warning Modal */
        #hard-warning-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        
        #hard-warning-modal.visible {
            display: flex;
        }
        
        .hard-warning-content {
            background-color: var(--bg-color);
            border: 2px solid #dc3545;
            border-radius: 8px;
            padding: 20px;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        .hard-warning-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            color: #dc3545;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .hard-warning-body {
            margin-bottom: 16px;
            line-height: 1.6;
        }
        
        .hard-warning-details {
            background-color: var(--log-bg);
            padding: 12px;
            border-radius: 4px;
            margin: 12px 0;
            border-left: 3px solid #dc3545;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .hard-warning-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        
        .hard-warning-button {
            flex: 1;
            padding: 10px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        
        .hard-warning-button:hover {
            opacity: 0.9;
        }
        
        .hard-warning-button.report {
            background-color: #dc3545;
            color: white;
        }
        
        .hard-warning-button.close {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <button class="settings-button" id="settings-button">⚙️</button>

    <h1>ComfyUI Auto Tagger</h1>

    <div class="section-title"></div>
    <div style="display: flex; gap: 20px; margin-bottom: 10px;">
        <div class="option-group">
            <input type="checkbox" id="chk-add-tags" checked>
            <label for="chk-add-tags"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-write-notes" checked>
            <label for="chk-write-notes"></label>
        </div>
    </div>

    <div class="section-title"></div>
    <div class="option-grid">
        <div class="option-group">
            <input type="checkbox" id="chk-checkpoint" checked>
            <label for="chk-checkpoint"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-lora" checked>
            <label for="chk-lora"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-positive" checked>
            <label for="chk-positive"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-negative">
            <label for="chk-negative"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-seed">
            <label for="chk-seed"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-sampler">
            <label for="chk-sampler"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-scheduler">
            <label for="chk-scheduler"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-steps">
            <label for="chk-steps"></label>
        </div>
        <div class="option-group">
            <input type="checkbox" id="chk-cfg">
            <label for="chk-cfg">CFG</label>
        </div>
    </div>

    <div id="controls">
        <button id="startButton"></button>
        <button id="deleteInfoButton"></button>
        <button id="cancelButton" style="display:none;"></button>
    </div>
    
    <!-- Hidden settings (synced with settings dialog) -->
    <input type="hidden" id="chunk-size" value="5">
    <select id="suspicious-node-handling" style="display:none;">
        <option value="exclude"></option>
        <option value="ask"></option>
        <option value="include"></option>
    </select>
    <input type="hidden" id="chk-fetch-dictionary">
    <input type="hidden" id="chk-debug-log">
    <input type="hidden" id="chk-include-all-samplers">
    
    <div id="progress-container">
        <div id="progress-bar"></div>
        <div id="progress-text">0 / 0</div>
    </div>

    <!-- Warning section for suspicious nodes -->
    <div id="warning-section">
        <div class="warning-header">
            <span class="warning-icon">⚠️</span>
            <span></span>
            <button class="warning-dismiss" onclick="dismissWarning()" title="">×</button>
        </div>
        <div class="warning-content">
            <div id="warning-message"></div>
            <div class="warning-actions">
                <button class="warning-button primary" onclick="includeAllNodes()"></button>
                <button class="warning-button" onclick="showWarningDetails()"></button>
                <button class="warning-button" onclick="copyWarningInfo()"></button>
            </div>
        </div>
    </div>

    <div id="log"></div>

    <!-- Dictionary status bar -->
    <div id="dictionary-status" style="margin-top: 10px; padding: 6px 10px; background-color: var(--log-bg); border-radius: 3px; font-size: 11px; color: var(--secondary-text); display: none;">
        <span id="dictionary-status-icon">ℹ️</span>
        <span id="dictionary-status-text"></span>
    </div>

    <!-- Settings dialog -->
    <div id="settings-dialog">
        <div class="settings-content">
            <div class="settings-header">
                <span></span>
                <button class="settings-close" id="settings-close">×</button>
            </div>

            <div class="settings-section">
                <div class="settings-section-title"></div>
                <div class="option-group">
                    <label for="chunk-size-settings"></label>
                    <input type="number" id="chunk-size-settings" value="5" min="1" max="50" style="margin-left: 8px;">
                </div>
                <div class="settings-description"></div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title"></div>
                <div class="option-group">
                    <label for="suspicious-node-handling-settings"></label>
                    <select id="suspicious-node-handling-settings" style="margin-left: 8px; padding: 4px 8px; background-color: var(--log-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 3px;">
                        <option value="exclude"></option>
                        <option value="ask"></option>
                        <option value="include"></option>
                    </select>
                </div>
                <div class="settings-description"></div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title"></div>
                <div class="option-group">
                    <input type="checkbox" id="chk-fetch-dictionary-settings">
                    <label for="chk-fetch-dictionary-settings"></label>
                </div>
                <div class="settings-description"></div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title"></div>
                <div class="option-group">
                    <input type="checkbox" id="chk-include-all-samplers-settings">
                    <label for="chk-include-all-samplers-settings"></label>
                </div>
                <div class="settings-description"></div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title"></div>
                <div class="option-group">
                    <input type="checkbox" id="chk-debug-log-settings">
                    <label for="chk-debug-log-settings"></label>
                </div>
                <div class="settings-description"></div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title"></div>
                <button class="settings-button-action" id="btn-report-issue" style="width: 100%; padding: 10px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-top: 8px;"></button>
                <div class="settings-description"></div>
            </div>
        </div>
    </div>

    <!-- Suspicious node confirmation dialog -->
    <div id="suspicious-node-dialog">
        <div class="dialog-content">
            <div class="dialog-header"></div>
            <div class="dialog-progress" id="dialog-progress"></div>
            <img id="dialog-image" class="dialog-image" alt="">
            <div class="dialog-info">
                <div><strong></strong> <span id="dialog-filename"></span></div>
                <div class="dialog-node-info">
                    <!-- 1. Node ID -->
                    <div class="dialog-node-id" id="dialog-node-id"></div>
                    
                    <!-- 2. Description (possibility) -->
                    <div style="margin-top: 12px; white-space: pre-line;" id="dialog-node-description"></div>
                    
                    <!-- 3. Question -->
                    <div style="margin-top: 12px; font-weight: 500;" id="dialog-node-question"></div>
                    
                    <!-- 4. Workflow graph visualization -->
                    <div style="margin-top: 12px;">
                        <div style="font-weight: 500; margin-bottom: 8px;"></div>
                        <div id="workflow-graph" style="padding: 12px; background-color: var(--log-bg); border-radius: 4px; overflow-x: auto;"></div>
                    </div>
                    
                    <!-- 5. Common cases -->
                    <div style="margin-top: 12px;">
                        <div style="font-weight: 500; margin-bottom: 4px;"></div>
                        <div style="margin-left: 16px;">
                            <div>✓ <span></span></div>
                            <div>✓ <span></span></div>
                        </div>
                    </div>
                    
                    <!-- 6. Hint -->
                    <div style="margin-top: 12px; padding: 8px; background-color: rgba(33, 150, 243, 0.1); border-left: 3px solid #2196f3; border-radius: 3px;">
                        <div></div>
                        <div style="margin-top: 4px; font-size: 11px; color: var(--secondary-text);"></div>
                    </div>
                </div>
            </div>
            <div class="dialog-actions">
                <button class="dialog-button exclude" id="btn-exclude-node"></button>
                <button class="dialog-button include" id="btn-include-node"></button>
                <button class="dialog-button exclude-all" id="btn-exclude-image"></button>
                <button class="dialog-button include-all" id="btn-include-image"></button>
            </div>
            <div style="text-align: center; margin-top: 8px; font-size: 11px; color: var(--secondary-text);">
            </div>
        </div>
    </div>
    
    <!-- Hard Warning Modal -->
    <div id="hard-warning-modal">
        <div class="hard-warning-content">
            <div class="hard-warning-header">
                <span>❌</span>
                <span></span>
            </div>
            <div class="hard-warning-body">
                <p id="hard-warning-message"></p>
                <div class="hard-warning-details" id="hard-warning-details"></div>
            </div>
            <div class="hard-warning-actions">
                <button class="hard-warning-button report" id="btn-report-error"></button>
                <button class="hard-warning-button close" id="btn-close-hard-warning"></button>
            </div>
        </div>
    </div>

    <!-- Utility Modules (must load first) -->
    <script src="js/metadata-parser/utils/ParsingUtils.js"></script>
    <script src="js/metadata-parser/utils/BinaryUtils.js"></script>
    <script src="js/metadata-parser/utils/ErrorHandler.js"></script>
    <script src="js/metadata-parser/utils/Validators.js"></script>
    
    <!-- Dictionary and Reporter (must load before graph layer) -->
    <script src="js/metadata-parser/dictionary/NodeDefinitionDictionary.js"></script>
    <script src="js/metadata-parser/reporter/MetadataExtractionReporter.js"></script>
    
    <!-- Error Types -->
    <script src="js/metadata-parser/errors/ParseError.js"></script>
    
    <!-- Binary Extraction Layer -->
    <script src="js/metadata-parser/binary-extraction/ImageMetadataReader.js"></script>
    <script src="js/metadata-parser/binary-extraction/FormatDetector.js"></script>
    
    <!-- Graph Layer (for ComfyUI) -->
    <script src="js/metadata-parser/graph/ComfyUIGraph.js"></script>
    <script src="js/metadata-parser/graph/ComfyUISamplerAnalyzer.js"></script>
    
    <!-- Parameter Parsing Layer (for A1111) -->
    <script src="js/metadata-parser/parameters/ParameterHandler.js"></script>
    <script src="js/metadata-parser/parameters/StandardParameterHandler.js"></script>
    <script src="js/metadata-parser/parameters/LoraHashHandler.js"></script>
    <script src="js/metadata-parser/parameters/ADetailerHandler.js"></script>
    <script src="js/metadata-parser/parameters/ParameterParser.js"></script>

    <!-- Dictionary Initialization -->
    <script>
        // Global dictionary instance
        window.globalDictionary = null;
        
        // Dictionary URL (GitHub raw content URL)
        const DICTIONARY_URL = 'https://raw.githubusercontent.com/NNNebel/comfyui-auto-tagger/main/js/metadata-parser/dictionary/default-dictionary.json?v=' + new Date().getTime();
        
        // Security: Validate URL is HTTPS and from trusted domain
        function isValidDictionaryURL(url) {
            try {
                const parsedURL = new URL(url);
                // Only allow HTTPS
                if (parsedURL.protocol !== 'https:') {
                    console.error('[Dictionary] Security: Only HTTPS URLs are allowed');
                    return false;
                }
                // Only allow GitHub raw content (you can add more trusted domains)
                const trustedDomains = ['raw.githubusercontent.com', 'gist.githubusercontent.com'];
                if (!trustedDomains.includes(parsedURL.hostname)) {
                    console.error('[Dictionary] Security: URL must be from trusted domain:', trustedDomains);
                    return false;
                }
                return true;
            } catch (error) {
                console.error('[Dictionary] Security: Invalid URL format');
                return false;
            }
        }
        
        // Show dictionary status message
        function showDictionaryStatus(icon, message, type = 'info') {
            const statusBar = document.getElementById('dictionary-status');
            const statusIcon = document.getElementById('dictionary-status-icon');
            const statusText = document.getElementById('dictionary-status-text');
            
            if (statusBar && statusIcon && statusText) {
                statusIcon.textContent = icon;
                statusText.textContent = message;
                statusBar.style.display = 'block';
                
                // Color based on type
                if (type === 'success') {
                    statusBar.style.borderLeft = '3px solid #28a745';
                } else if (type === 'error') {
                    statusBar.style.borderLeft = '3px solid #dc3545';
                } else if (type === 'warning') {
                    statusBar.style.borderLeft = '3px solid #ffc107';
                } else {
                    statusBar.style.borderLeft = '3px solid var(--border-color)';
                }
                
                // Auto-hide after 10 seconds
                setTimeout(() => {
                    statusBar.style.display = 'none';
                }, 10000);
            }
        }
        
        // Fetch dictionary with security checks and timeout
        async function secureFetchDictionary(url) {
            // Security check
            if (!isValidDictionaryURL(url)) {
                throw new Error('Invalid or untrusted dictionary URL');
            }
            
            // Fetch with timeout (10 seconds)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            
            try {
                const response = await fetch(url, {
                    signal: controller.signal,
                    headers: {
                        'Accept': 'application/json'
                    },
                    // Security: Prevent credentials from being sent
                    credentials: 'omit',
                    // Security: Prevent redirects to malicious sites
                    redirect: 'error'
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // Verify Content-Type (allow both application/json and text/plain for GitHub raw content)
                const contentType = response.headers.get('content-type');
                if (!contentType || !(contentType.includes('application/json') || contentType.includes('text/plain'))) {
                    console.warn('[Dictionary] Unexpected Content-Type:', contentType);
                }
                
                // Security: Get response as text first to validate before parsing
                const responseText = await response.text();
                
                // Security: Check response size (max 1MB for dictionary)
                if (responseText.length > 1024 * 1024) {
                    throw new Error('Dictionary file too large (max 1MB)');
                }
                
                // Security: Parse JSON safely
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    throw new Error('Invalid JSON format');
                }
                
                // Security: Validate data is a plain object (not a function, array, etc.)
                if (typeof data !== 'object' || data === null || Array.isArray(data)) {
                    throw new Error('Dictionary must be a JSON object');
                }
                
                // Security: Sanitize the data - remove any functions or dangerous properties
                const sanitizedData = sanitizeDictionaryData(data);
                
                return sanitizedData;
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    throw new Error('Dictionary fetch timeout (10s)');
                }
                throw error;
            }
        }
        
        // Security: Sanitize dictionary data to prevent code injection
        function sanitizeDictionaryData(data) {
            // Deep clone to avoid modifying original
            const sanitized = {};
            
            // Only allow specific top-level keys
            const allowedKeys = ['version', 'nodes'];
            for (const key of allowedKeys) {
                if (key in data) {
                    if (key === 'version') {
                        // Version must be a string
                        if (typeof data.version === 'string') {
                            sanitized.version = data.version;
                        }
                    } else if (key === 'nodes') {
                        // Nodes must be an object
                        if (typeof data.nodes === 'object' && data.nodes !== null && !Array.isArray(data.nodes)) {
                            sanitized.nodes = sanitizeNodes(data.nodes);
                        }
                    }
                }
            }
            
            return sanitized;
        }
        
        // Security: Sanitize nodes object
        function sanitizeNodes(nodes) {
            const sanitized = {};
            
            for (const [nodeName, nodeData] of Object.entries(nodes)) {
                // Node name must be a string
                if (typeof nodeName !== 'string') continue;
                
                // Node data must be an object
                if (typeof nodeData !== 'object' || nodeData === null || Array.isArray(nodeData)) continue;
                
                // Sanitize node definition
                sanitized[nodeName] = sanitizeNodeDefinition(nodeData);
            }
            
            return sanitized;
        }
        
        // Security: Sanitize individual node definition
        function sanitizeNodeDefinition(nodeData) {
            const sanitized = {};
            
            // Only allow specific keys with specific types
            const allowedFields = {
                'type': 'string',
                'class_type': 'string',
                'port_mapping': 'object',
                'passthrough_rules': 'object',
                'value_path': ['string', 'array'],
                'value_paths': ['object', 'array'],
                'metadata_type': 'string'
            };
            
            for (const [key, allowedType] of Object.entries(allowedFields)) {
                if (key in nodeData) {
                    const value = nodeData[key];
                    const valueType = Array.isArray(value) ? 'array' : typeof value;
                    
                    // Check if type matches
                    const allowedTypes = Array.isArray(allowedType) ? allowedType : [allowedType];
                    if (allowedTypes.includes(valueType)) {
                        // Special handling for specific fields
                        if (key === 'passthrough_rules') {
                            sanitized[key] = sanitizePassthroughRules(value);
                        } else if (key === 'port_mapping') {
                            sanitized[key] = sanitizePortMapping(value);
                        } else if (valueType === 'object') {
                            sanitized[key] = sanitizePlainObject(value);
                        } else if (valueType === 'array') {
                            sanitized[key] = sanitizeArray(value);
                        } else {
                            sanitized[key] = value;
                        }
                    }
                }
            }
            
            return sanitized;
        }
        
        // Security: Sanitize passthrough_rules (must be object with string keys and string array values)
        function sanitizePassthroughRules(rules) {
            if (typeof rules !== 'object' || rules === null || Array.isArray(rules)) {
                return {};
            }
            
            const sanitized = {};
            for (const [outputPort, inputPorts] of Object.entries(rules)) {
                // Output port must be a string
                if (typeof outputPort !== 'string') continue;
                
                // Input ports must be an array of strings
                if (!Array.isArray(inputPorts)) continue;
                
                const sanitizedPorts = inputPorts.filter(port => typeof port === 'string');
                if (sanitizedPorts.length > 0) {
                    sanitized[outputPort] = sanitizedPorts;
                }
            }
            
            return sanitized;
        }
        
        // Security: Sanitize port_mapping (must be object with string keys and array values)
        function sanitizePortMapping(mapping) {
            if (typeof mapping !== 'object' || mapping === null || Array.isArray(mapping)) {
                return {};
            }
            
            const sanitized = {};
            for (const [metadataType, portPath] of Object.entries(mapping)) {
                // Metadata type must be a string
                if (typeof metadataType !== 'string') continue;
                
                // Port path must be an array
                if (!Array.isArray(portPath)) continue;
                
                // Sanitize the array (only strings allowed)
                const sanitizedPath = sanitizeArray(portPath);
                sanitized[metadataType] = sanitizedPath;
            }
            
            return sanitized;
        }
        
        // Security: Sanitize plain object (only primitives allowed)
        function sanitizePlainObject(obj) {
            if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) {
                return {};
            }
            
            const sanitized = {};
            for (const [key, value] of Object.entries(obj)) {
                const valueType = Array.isArray(value) ? 'array' : typeof value;
                
                if (valueType === 'string' || valueType === 'number' || valueType === 'boolean') {
                    sanitized[key] = value;
                } else if (valueType === 'array') {
                    sanitized[key] = sanitizeArray(value);
                } else if (valueType === 'object') {
                    sanitized[key] = sanitizePlainObject(value);
                }
                // Ignore functions, symbols, undefined, etc.
            }
            
            return sanitized;
        }
        
        // Security: Sanitize array (only primitives and plain objects allowed)
        function sanitizeArray(arr) {
            if (!Array.isArray(arr)) {
                return [];
            }
            
            return arr.map(item => {
                const itemType = Array.isArray(item) ? 'array' : typeof item;
                
                if (itemType === 'string' || itemType === 'number' || itemType === 'boolean') {
                    return item;
                } else if (itemType === 'object') {
                    return sanitizePlainObject(item);
                } else if (itemType === 'array') {
                    return sanitizeArray(item);
                }
                // Ignore functions, symbols, undefined, etc.
                return null;
            }).filter(item => item !== null);
        }
        
        // Load dictionary fetch preference from localStorage
        function getDictionaryFetchPreference() {
            const saved = localStorage.getItem('dictionary_fetch_enabled');
            return saved === null ? true : saved === 'true'; // Default: enabled
        }
        
        // Save dictionary fetch preference to localStorage
        function saveDictionaryFetchPreference(enabled) {
            localStorage.setItem('dictionary_fetch_enabled', enabled.toString());
        }
        
        // Initialize dictionary on plugin load
        async function initializeDictionary() {
            const fetchEnabled = getDictionaryFetchPreference();
            
            // Set checkbox state
            const checkbox = document.getElementById('chk-fetch-dictionary');
            if (checkbox) {
                checkbox.checked = fetchEnabled;
            }
            
            // Helper function to get translated text
            const t = (key) => window.i18next ? window.i18next.t(key) : key;
            
            if (!fetchEnabled) {
                console.log('[Dictionary] Online fetch disabled by user preference');
                window.globalDictionary = window.NodeDefinitionDictionary.getDefault();
                showDictionaryStatus('📦', t('dictionary.bundled'), 'info');
                return;
            }
            
            try {
                console.log('[Dictionary] Fetching from URL:', DICTIONARY_URL);
                showDictionaryStatus('⏳', t('dictionary.fetching'), 'info');
                
                const data = await secureFetchDictionary(DICTIONARY_URL);
                window.globalDictionary = new window.NodeDefinitionDictionary(data);
                
                // Validate the fetched dictionary
                const validation = window.globalDictionary.validate();
                if (!validation.valid) {
                    console.error('[Dictionary] Invalid dictionary from URL:', validation.errors);
                    console.error('[Dictionary] Validation errors detail:', JSON.stringify(validation.errors, null, 2));
                    throw new Error('Invalid dictionary structure: ' + validation.errors.join(', '));
                }
                
                // Save to cache on successful fetch
                window.globalDictionary.saveToCache();
                console.log('[Dictionary] Successfully loaded from URL');
                showDictionaryStatus('✅', t('dictionary.fetchSuccess'), 'success');
            } catch (error) {
                console.error('[Dictionary] Failed to fetch from URL:', error);
                
                // Try to load from cache
                const cached = window.NodeDefinitionDictionary.loadFromCache();
                if (cached) {
                    window.globalDictionary = cached;
                    console.log('[Dictionary] Using cached dictionary');
                    showDictionaryStatus('💾', t('dictionary.cached'), 'warning');
                    return;
                }
                
                // Fall back to default dictionary
                window.globalDictionary = window.NodeDefinitionDictionary.getDefault();
                console.log('[Dictionary] Using default dictionary');
                showDictionaryStatus('⚠️', t('dictionary.fetchFailed'), 'error');
            }
        }
        
        // Handle checkbox change and initialize all settings from localStorage
        document.addEventListener('DOMContentLoaded', () => {
            // Define default values
            const defaults = {
                chunk_size: '5',
                suspicious_node_handling: 'exclude',
                debug_log_enabled: 'false',
                include_all_samplers: 'false'
            };
            
            // Initialize chunk size
            const chunkSize = document.getElementById('chunk-size');
            const chunkSizeSettings = document.getElementById('chunk-size-settings');
            if (chunkSize && chunkSizeSettings) {
                const saved = localStorage.getItem('chunk_size') || defaults.chunk_size;
                chunkSize.value = saved;
                chunkSizeSettings.value = saved;
            }
            
            // Initialize suspicious node handling
            const suspiciousHandling = document.getElementById('suspicious-node-handling');
            const suspiciousHandlingSettings = document.getElementById('suspicious-node-handling-settings');
            if (suspiciousHandling && suspiciousHandlingSettings) {
                const saved = localStorage.getItem('suspicious_node_handling') || defaults.suspicious_node_handling;
                suspiciousHandling.value = saved;
                suspiciousHandlingSettings.value = saved;
                // Trigger change event to update chunk size state
                suspiciousHandling.dispatchEvent(new Event('change'));
            }
            
            // Initialize dictionary fetch preference
            const checkbox = document.getElementById('chk-fetch-dictionary-settings');
            if (checkbox) {
                // Initialize checkbox state
                checkbox.checked = getDictionaryFetchPreference();
                
                checkbox.addEventListener('change', (e) => {
                    const enabled = e.target.checked;
                    saveDictionaryFetchPreference(enabled);
                    
                    if (enabled) {
                        showDictionaryStatus('🔄', '次回起動時にオンラインから辞書を取得します', 'info');
                    } else {
                        showDictionaryStatus('📦', '次回起動時はバンドルされた辞書を使用します', 'info');
                    }
                });
            }
            
            // Initialize debug log setting
            const debugLog = document.getElementById('chk-debug-log');
            const debugLogSettings = document.getElementById('chk-debug-log-settings');
            if (debugLog && debugLogSettings) {
                const saved = localStorage.getItem('debug_log_enabled') || defaults.debug_log_enabled;
                const isEnabled = saved === 'true';
                debugLog.checked = isEnabled;
                debugLogSettings.checked = isEnabled;
            }
            
            // Initialize include all samplers setting
            const includeAllSamplersCheckbox = document.getElementById('chk-include-all-samplers-settings');
            const includeAllSamplersHidden = document.getElementById('chk-include-all-samplers');
            
            if (includeAllSamplersCheckbox && includeAllSamplersHidden) {
                // Load saved preference (default: false)
                const saved = localStorage.getItem('include_all_samplers') || defaults.include_all_samplers;
                const isEnabled = saved === 'true';
                
                includeAllSamplersCheckbox.checked = isEnabled;
                includeAllSamplersHidden.checked = isEnabled;
            }
        });
        
        // Export initializeDictionary to window for plugin.js to call after i18n is ready
        window.initializeDictionary = initializeDictionary;
    </script>
    
    <script>
        // Settings dialog management
        document.addEventListener('DOMContentLoaded', () => {
            const settingsButton = document.getElementById('settings-button');
            const settingsDialog = document.getElementById('settings-dialog');
            const settingsClose = document.getElementById('settings-close');
            const btnReportIssue = document.getElementById('btn-report-issue');
            
            // Open settings dialog
            if (settingsButton) {
                settingsButton.addEventListener('click', () => {
                    // Sync settings from main UI to dialog
                    syncSettingsToDialog();
                    settingsDialog.classList.add('visible');
                    
                    // Resize window for settings dialog
                    if (typeof eagle !== 'undefined' && eagle.window) {
                        try {
                            console.log('[Settings] Resizing window to 640x900');
                            eagle.window.setSize(640, 900);
                        } catch (e) {
                            console.log('Window resize not supported:', e);
                        }
                    }
                });
            }
            
            // Close settings dialog
            if (settingsClose) {
                settingsClose.addEventListener('click', () => {
                    // Sync settings from dialog to main UI
                    syncSettingsFromDialog();
                    settingsDialog.classList.remove('visible');
                    // Trigger change event to save settings in plugin.js
                    document.dispatchEvent(new CustomEvent('settingsChanged'));
                    
                    // Resize window back to normal
                    if (typeof eagle !== 'undefined' && eagle.window) {
                        try {
                            console.log('[Settings] Resizing window back to 640x520');
                            eagle.window.setSize(640, 520);
                        } catch (e) {
                            console.log('Window resize not supported:', e);
                        }
                    }
                });
            }
            
            // Close on background click
            settingsDialog.addEventListener('click', (e) => {
                if (e.target === settingsDialog) {
                    syncSettingsFromDialog();
                    settingsDialog.classList.remove('visible');
                    // Trigger change event to save settings in plugin.js
                    document.dispatchEvent(new CustomEvent('settingsChanged'));
                    
                    // Resize window back to normal
                    if (typeof eagle !== 'undefined' && eagle.window) {
                        try {
                            console.log('[Settings] Resizing window back to 640x520 (background click)');
                            eagle.window.setSize(640, 520);
                        } catch (e) {
                            console.log('Window resize not supported:', e);
                        }
                    }
                }
            });
            
            // Report issue button
            if (btnReportIssue) {
                btnReportIssue.addEventListener('click', () => {
                    openGitHubIssue();
                });
            }
        });
        
        // Open GitHub issue page
        function openGitHubIssue() {
            // GitHub repository URL
            const repoUrl = 'https://github.com/NNNebel/comfyui-auto-tagger';
            const issueUrl = `${repoUrl}/issues/new`;
            
            // Open in browser
            if (typeof eagle !== 'undefined' && eagle.app && eagle.app.openURL) {
                eagle.app.openURL(issueUrl);
            } else if (typeof window !== 'undefined') {
                window.open(issueUrl, '_blank');
            }
        }

            const chunkSize = document.getElementById('chunk-size');
            const chunkSizeSettings = document.getElementById('chunk-size-settings');

            // Suspicious node handling
            const suspiciousHandling = document.getElementById('suspicious-node-handling');
            const suspiciousHandlingSettings = document.getElementById('suspicious-node-handling-settings');
            if (suspiciousHandling && suspiciousHandlingSettings) {
                suspiciousHandlingSettings.value = suspiciousHandling.value;

            // Dictionary fetch

                debugLogSettings.checked = debugLog.checked;
            }
            
            // Include all samplers
            const includeAllSamplers = document.getElementById('chk-include-all-samplers');
            const includeAllSamplersSettings = document.getElementById('chk-include-all-samplers-settings');
            if (includeAllSamplers && includeAllSamplersSettings) {
                includeAllSamplersSettings.checked = includeAllSamplers.checked;
            }
        }
        
        // Sync settings from dialog to main UI
        function syncSettingsFromDialog() {

            const chunkSize = document.getElementById('chunk-size');

            if (chunkSize && chunkSizeSettings) {

                localStorage.setItem('chunk_size', chunkSizeSettings.value);
            }
            
            // Suspicious node handling
            const suspiciousHandling = document.getElementById('suspicious-node-handling');

            if (suspiciousHandling && suspiciousHandlingSettings) {
                suspiciousHandling.value = suspiciousHandlingSettings.value;
                localStorage.setItem('suspicious_node_handling', suspiciousHandlingSettings.value);
                // Trigger change event to update chunk size state
                suspiciousHandling.dispatchEvent(new Event('change'));
            }
            
            // Dictionary fetch

            if (fetchDict && fetchDictSettings) {

            if (debugLog && debugLogSettings) {
                debugLog.checked = debugLogSettings.checked;
                localStorage.setItem('debug_log_enabled', debugLogSettings.checked);
                // Trigger change event if needed
                debugLog.dispatchEvent(new Event('change'));
            }
            
            // Include all samplers
            const includeAllSamplers = document.getElementById('chk-include-all-samplers');
            const includeAllSamplersSettings = document.getElementById('chk-include-all-samplers-settings');
            if (includeAllSamplers && includeAllSamplersSettings) {
                includeAllSamplers.checked = includeAllSamplersSettings.checked;
                localStorage.setItem('include_all_samplers', includeAllSamplersSettings.checked);
            }
        }

    <script>
        // Warning display functions
        function showSoftWarning(message, excludedCount) {
            const warningSection = document.getElementById('warning-section');
            const warningMessage = document.getElementById('warning-message');
            
            if (warningSection && warningMessage) {
                warningMessage.innerHTML = `
                    <div style="margin-bottom: 8px;">
                        ${message}
                    </div>
                    <div style="font-size: 11px; color: var(--secondary-text);">
                        除外されたノード数: ${excludedCount}
                    </div>
                `;
                warningSection.classList.add('visible');
            }
        }
        
        function dismissWarning() {
            const warningSection = document.getElementById('warning-section');
            if (warningSection) {
                warningSection.classList.remove('visible');
            }
        }
        
        function showWarningDetails() {
            // Get soft warnings from ErrorHandler
            if (window.ErrorHandler) {
                const softWarnings = window.ErrorHandler.getSoftWarnings();
                if (softWarnings && softWarnings.length > 0) {
                    const details = softWarnings.map(w => 
                        `[${w.component}] ${w.message}\n${JSON.stringify(w.context, null, 2)}`
                    ).join('\n\n');
                    
                    alert('警告の詳細:\n\n' + details);
                }
            }
        }
        
        function copyWarningInfo() {
            // Get soft warnings from ErrorHandler
            if (window.ErrorHandler) {
                const softWarnings = window.ErrorHandler.getSoftWarnings();
                if (softWarnings && softWarnings.length > 0) {
                    const info = JSON.stringify(softWarnings, null, 2);
                    
                    // Copy to clipboard
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(info).then(() => {
                            alert('警告情報をクリップボードにコピーしました');
                        }).catch(err => {
                            console.error('Failed to copy:', err);
                            alert('コピーに失敗しました');
                        });
                    } else {
                        // Fallback for older browsers
                        const textarea = document.createElement('textarea');
                        textarea.value = info;
                        document.body.appendChild(textarea);
                        textarea.select();
                        try {
                            document.execCommand('copy');
                            alert('警告情報をクリップボードにコピーしました');
                        } catch (err) {
                            console.error('Failed to copy:', err);
                            alert('コピーに失敗しました');
                        }
                        document.body.removeChild(textarea);
                    }
                }
            }
        }
        
        function includeAllNodes() {
            // This function is called when user wants to include all excluded nodes
            // In the current implementation, this would require re-processing
            alert('この機能は現在実装中です。画像を再処理してください。');
            dismissWarning();
        }
        
        // Export functions for global use
        window.showSoftWarning = showSoftWarning;
        window.dismissWarning = dismissWarning;
        window.showWarningDetails = showWarningDetails;
        window.copyWarningInfo = copyWarningInfo;
        window.includeAllNodes = includeAllNodes;
    </script>
    
    <script>
        // Hard Warning display and error reporting
        let currentReporter = null; // Store current MetadataExtractionReporter instance
        
        function showHardWarning(message, reporter) {
            currentReporter = reporter;
            
            const modal = document.getElementById('hard-warning-modal');
            const messageEl = document.getElementById('hard-warning-message');
            const detailsEl = document.getElementById('hard-warning-details');
            
            if (modal && messageEl && detailsEl) {
                messageEl.textContent = message;
                
                // Show hard warnings from ErrorHandler
                if (window.ErrorHandler) {
                    const hardWarnings = window.ErrorHandler.getHardWarnings();
                    if (hardWarnings && hardWarnings.length > 0) {
                        const details = hardWarnings.map(w => 
                            `[${w.component}] ${w.message}\n${JSON.stringify(w.context, null, 2)}`
                        ).join('\n\n');
                        detailsEl.textContent = details;
                    } else {
                        detailsEl.textContent = 'エラーの詳細情報がありません';
                    }
                }
                
                modal.classList.add('visible');
            }
        }
        
        function closeHardWarning() {
            const modal = document.getElementById('hard-warning-modal');
            if (modal) {
                modal.classList.remove('visible');
            }
            currentReporter = null;
        }
        
        function reportError() {
            if (!currentReporter) {
                alert('エラー報告情報が利用できません');
                return;
            }
            
            try {
                // Generate error report
                const report = currentReporter.generateReport();
                
                // Copy to clipboard
                currentReporter.copyToClipboard();
                
                // Open GitHub issue page
                currentReporter.openGitHubIssue();
                
                // Show instruction message
                alert('エラー報告をクリップボードにコピーしました。\n\n開いたGitHubページに貼り付けて、画像を添付してください。');
                
                closeHardWarning();
            } catch (error) {
                console.error('Failed to generate error report:', error);
                alert('エラー報告の生成に失敗しました: ' + error.message);
            }
        }
        
        // Export functions for global use
        window.showHardWarning = showHardWarning;
        window.closeHardWarning = closeHardWarning;
        window.reportError = reportError;
        
        // Add event listeners for Hard Warning modal
        document.addEventListener('DOMContentLoaded', function() {
            const btnReport = document.getElementById('btn-report-error');
            const btnClose = document.getElementById('btn-close-hard-warning');
            
            if (btnReport) {
                btnReport.addEventListener('click', reportError);
            }
            
            if (btnClose) {
                btnClose.addEventListener('click', closeHardWarning);
            }
            
            // Close on background click
            const modal = document.getElementById('hard-warning-modal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeHardWarning();
                    }
                });
            }
        });
    </script>
    
    <script>
        // Step-centric suspicious node dialog state
        let dialogSteps = [];
        let currentDialogStepIndex = 0;
        let stepDecisions = {};            // { stepIndex: 'include'|'exclude' }
        let suspiciousNodeResolve = null;
        let currentImageItem = null;
        let globalSuspiciousNodeDecision = null;

        function getSuspiciousNodeHandling() {
            const select = document.getElementById('suspicious-node-handling');
            return select ? select.value : 'exclude';
        }

        async function handleSuspiciousNodes(imageItem, suspiciousNodes) {
            const handling = getSuspiciousNodeHandling();

            console.log('[DEBUG] handleSuspiciousNodes called for:', imageItem.name);
            console.log('[DEBUG] globalSuspiciousNodeDecision:', globalSuspiciousNodeDecision);
            console.log('[DEBUG] handling mode:', handling);

            if (globalSuspiciousNodeDecision) {
                console.log('[DEBUG] Using global decision:', globalSuspiciousNodeDecision, 'for image:', imageItem.name);
                return { action: globalSuspiciousNodeDecision, overrides: {} };
            }

            if (handling === 'exclude') {
                console.log('[DEBUG] Using exclude mode (no dialog)');
                return { action: 'exclude', overrides: {} };
            } else if (handling === 'include') {
                console.log('[DEBUG] Using include mode (no dialog)');
                return { action: 'include', overrides: {} };
            } else if (handling === 'ask') {
                console.log('[DEBUG] Showing dialog for:', imageItem.name);
                return await showSuspiciousNodeDialog(imageItem, suspiciousNodes);
            }
        }

        async function showSuspiciousNodeDialog(imageItem, suspiciousNodes) {
            return new Promise((resolve) => {
                dialogSteps = window.SuspiciousNodeDialog.buildDialogSteps({ suspiciousNodes });

                // No step-level dialog needed (orphan-only or empty) — fall back to legacy behaviour:
                // exclude all suspicious nodes.
                if (dialogSteps.length === 0) {
                    console.log('[DEBUG] No dialog steps to show, defaulting to exclude');
                    resolve({ action: 'exclude', overrides: {} });
                    return;
                }

                currentDialogStepIndex = 0;
                stepDecisions = {};
                suspiciousNodeResolve = resolve;
                currentImageItem = imageItem;

                showNextDialogStep();
            });
        }

        function showNextDialogStep() {
            if (currentDialogStepIndex >= dialogSteps.length) {
                // All steps processed
                document.getElementById('suspicious-node-dialog').classList.remove('visible');

                console.log('[DEBUG] Resizing window back to 550px');
                if (typeof eagle !== 'undefined' && eagle.window) {
                    try {
                        eagle.window.setSize(640, 550);
                    } catch (e) {
                        console.log('Window resize not supported:', e);
                    }
                }

                const result = window.SuspiciousNodeDialog.mapStepDecisionsToNodeOverrides(
                    dialogSteps,
                    stepDecisions
                );

                if (suspiciousNodeResolve) {
                    suspiciousNodeResolve(result);
                    suspiciousNodeResolve = null;
                }
                currentImageItem = null;
                return;
            }

            const step = dialogSteps[currentDialogStepIndex];
            const dialog = document.getElementById('suspicious-node-dialog');
            const t = (key, params) => (window.i18next ? window.i18next.t(key, params) : key);

            // Step n / total
            document.getElementById('dialog-progress').textContent =
                t('suspiciousNode.stepDisplay', {
                    stepIndex: currentDialogStepIndex + 1,
                    totalSteps: dialogSteps.length
                });

            // Image preview
            const img = document.getElementById('dialog-image');
            img.src = currentImageItem.url || currentImageItem.filePath;
            document.getElementById('dialog-filename').textContent = currentImageItem.name;

            // Sampler header (e.g. "KSampler (seed: 123, steps: 20, cfg: 7)")
            const meta = step.stepMetadata || {};
            const titleKey = step.type === 'excluded-sampler'
                ? 'suspiciousNode.excludedSamplerTitle'
                : 'suspiciousNode.suspiciousSamplerTitle';
            const headerText = t(titleKey, {
                samplerType: meta.nodeType || 'Sampler',
                nodeId: meta.nodeId || '?'
            });
            document.getElementById('dialog-node-id').textContent = headerText;

            // Sampler parameters line
            document.getElementById('dialog-node-description').textContent = t('suspiciousNode.samplerInfo', {
                samplerType: meta.nodeType || 'Sampler',
                seed: meta.seed != null ? meta.seed : '?',
                steps: meta.steps != null ? meta.steps : '?',
                cfg: meta.cfg != null ? meta.cfg : '?'
            });

            // Question line
            document.getElementById('dialog-node-question').textContent = t('suspiciousNode.notExecuted');

            // Render workflow graph and warning cards
            drawWorkflowGraph(step);

            dialog.classList.add('visible');

            console.log('[DEBUG] Resizing window to 1250px for dialog');
            if (typeof eagle !== 'undefined' && eagle.window) {
                try {
                    eagle.window.setSize(640, 1250);
                } catch (e) {
                    console.log('Window resize not supported:', e);
                }
            }
        }

        function drawWorkflowGraph(step) {
            const container = document.getElementById('workflow-graph');
            if (!container) return;
            container.innerHTML = '';

            if (!step) {
                container.innerHTML = '';
                return;
            }

            const t = (key, params) => (window.i18next ? window.i18next.t(key, params) : key);
            const meta = step.stepMetadata || {};
            const suspNodes = step.suspiciousNodesInfo || [];

            // Create canvas for workflow visualization
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 180;
            canvas.style.maxWidth = '100%';
            canvas.style.border = '1px solid var(--border-color)';
            canvas.style.borderRadius = '3px';
            canvas.style.marginBottom = '12px';
            canvas.style.backgroundColor = 'rgba(0,0,0,0.03)';

            const ctx = canvas.getContext('2d');
            if (!ctx) {
                container.innerHTML = '<div style="color: var(--secondary-text);">Graph not available</div>';
                return;
            }

            // Draw workflow graph
            const padding = 20;
            const nodeWidth = 100;
            const nodeHeight = 50;
            const centerY = canvas.height / 2;

            // Helper to draw a node box
            const drawNode = (x, y, label, subLabel, isHighlight) => {
                const bgColor = isHighlight ? 'rgba(76, 175, 80, 0.15)' : 'rgba(200, 200, 200, 0.2)';
                const borderColor = isHighlight ? '#4CAF50' : '#999';
                const textColor = isHighlight ? '#2E7D32' : '#333';

                ctx.fillStyle = bgColor;
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = isHighlight ? 2 : 1;
                ctx.fillRect(x, y, nodeWidth, nodeHeight);
                ctx.strokeRect(x, y, nodeWidth, nodeHeight);

                ctx.fillStyle = textColor;
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(label, x + nodeWidth/2, y + 18);

                if (subLabel) {
                    ctx.font = '9px sans-serif';
                    ctx.fillStyle = '#666';
                    ctx.fillText(subLabel, x + nodeWidth/2, y + 33);
                }
            };

            // Draw arrow between nodes
            const drawArrow = (x1, y1, x2, y2) => {
                const headlen = 8;
                const angle = Math.atan2(y2 - y1, x2 - x1);

                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                // Arrow head
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fill();
            };

            // Position nodes
            const upstreamX = padding;
            const samplerX = upstreamX + nodeWidth + 60;
            const downstreamX = samplerX + nodeWidth + 60;

            // Draw upstream nodes (generic input)
            drawNode(upstreamX, centerY - nodeHeight/2, 'Input', 'nodes', false);

            // Draw arrows
            drawArrow(upstreamX + nodeWidth, centerY, samplerX, centerY);
            drawArrow(samplerX + nodeWidth, centerY, downstreamX, centerY);

            // Draw center sampler (highlighted)
            const samplerLabel = meta.nodeType || 'Sampler';
            const samplerSubLabel = `#${meta.nodeId || '?'}`;
            drawNode(samplerX, centerY - nodeHeight/2, samplerLabel, samplerSubLabel, true);

            // Draw downstream nodes (generic output)
            drawNode(downstreamX, centerY - nodeHeight/2, 'Output', 'nodes', false);

            container.appendChild(canvas);

            // Add warning cards below graph
            renderWarningCards(suspNodes);
        }

        function renderWarningCards(suspiciousNodes) {
            const container = document.getElementById('workflow-graph');
            if (!container) return;

            if (!suspiciousNodes || suspiciousNodes.length === 0) {
                const noInfo = window.i18next ? window.i18next.t('suspiciousNode.noGraphInfo') : 'No info';
                const div = document.createElement('div');
                div.style.color = 'var(--secondary-text)';
                div.style.fontSize = '11px';
                div.textContent = noInfo;
                container.appendChild(div);
                return;
            }

            const t = (key, params) => (window.i18next ? window.i18next.t(key, params) : key);
            const nodeLabel = t('suspiciousNode.nodeLabel');
            const reasonLabel = t('suspiciousNode.reasonLabel');
            const suggestionLabel = t('suspiciousNode.suggestionLabel');

            const escape = (s) => String(s).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));

            let html = '<div style="display: flex; flex-direction: column; gap: 10px;">';
            for (const n of suspiciousNodes) {
                const reason = n.reasonKey ? t(n.reasonKey, n.reasonParams || {}) : '';
                const suggestion = n.suggestionKey ? t(n.suggestionKey, n.suggestionParams || {}) : '';
                html += `
                    <div style="padding: 10px; background-color: rgba(244, 67, 54, 0.08); border-left: 3px solid #f44336; border-radius: 3px; font-size: 12px;">
                        <div style="font-weight: 600; margin-bottom: 4px;">${escape(nodeLabel)}: ${escape(n.nodeType || 'Unknown')} #${escape(n.nodeId || '?')}</div>
                        ${reason ? `<div style="margin-top: 4px;"><span style="color: var(--secondary-text);">${escape(reasonLabel)}:</span> ${escape(reason)}</div>` : ''}
                        ${suggestion ? `<div style="margin-top: 4px;"><span style="color: var(--secondary-text);">${escape(suggestionLabel)}:</span> ${escape(suggestion)}</div>` : ''}
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML += html;
        }

        function handleStepDecision(event, decision, scope) {
            const step = dialogSteps[currentDialogStepIndex];
            const isShiftPressed = event && event.shiftKey;

            console.log('[DEBUG] handleStepDecision called:', {
                decision, scope, isShiftPressed, stepIndex: step && step.stepIndex
            });

            if (scope === 'node') {
                // Apply to current step only
                if (step) stepDecisions[step.stepIndex] = decision;
                currentDialogStepIndex++;
            } else if (scope === 'image') {
                // Apply to all remaining steps in current image
                for (let i = currentDialogStepIndex; i < dialogSteps.length; i++) {
                    stepDecisions[dialogSteps[i].stepIndex] = decision;
                }
                currentDialogStepIndex = dialogSteps.length;
            }

            if (isShiftPressed) {
                console.log('[DEBUG] Setting global decision:', decision);
                globalSuspiciousNodeDecision = decision;
            }

            showNextDialogStep();
        }

        // Export for use in plugin.js
        window.handleSuspiciousNodes = handleSuspiciousNodes;
        window.getSuspiciousNodeHandling = getSuspiciousNodeHandling;
        window.resetGlobalSuspiciousNodeDecision = function() {
            console.log('[DEBUG] Resetting global decision');
            globalSuspiciousNodeDecision = null;
        };

        // Add event listeners to dialog buttons
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('btn-exclude-node').addEventListener('click', function(e) {
                handleStepDecision(e, 'exclude', 'node');
            });
            document.getElementById('btn-include-node').addEventListener('click', function(e) {
                handleStepDecision(e, 'include', 'node');
            });
            document.getElementById('btn-exclude-image').addEventListener('click', function(e) {
                handleStepDecision(e, 'exclude', 'image');
            });
            document.getElementById('btn-include-image').addEventListener('click', function(e) {
                handleStepDecision(e, 'include', 'image');
            });
        });
        
        // Update chunk size input state based on suspicious node handling
        function updateChunkSizeState() {
            const select = document.getElementById('suspicious-node-handling');
            const chunkSizeInput = document.getElementById('chunk-size');
            const chunkSizeLabel = document.querySelector('label[for="chunk-size"]');
            
            if (select && chunkSizeInput) {
                const isAskMode = select.value === 'ask';
                chunkSizeInput.disabled = isAskMode;
                
                // Update visual style
                if (isAskMode) {
                    chunkSizeInput.style.opacity = '0.5';
                    chunkSizeInput.style.cursor = 'not-allowed';
                    if (chunkSizeLabel) {
                        chunkSizeLabel.style.opacity = '0.5';
                    }
                } else {
                    chunkSizeInput.style.opacity = '1';
                    chunkSizeInput.style.cursor = 'text';
                    if (chunkSizeLabel) {
                        chunkSizeLabel.style.opacity = '1';
                    }
                }
            }
        }
        
        // Add event listener to suspicious node handling select
        const suspiciousNodeHandlingSelect = document.getElementById('suspicious-node-handling');
        if (suspiciousNodeHandlingSelect) {
            suspiciousNodeHandlingSelect.addEventListener('change', updateChunkSizeState);
        }
        
        // Initialize state on page load
        document.addEventListener('DOMContentLoaded', updateChunkSizeState);
        // Also call immediately in case DOMContentLoaded already fired
        updateChunkSizeState();
    </script>
